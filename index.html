"use strict";
/* =========================================================================
   LUMINA — A Guardiã da Luz
   Um platformer atmosférico. Você é a última centelha viva num mundo que
   perdeu suas estrelas. Reúna os fragmentos, expulse a Sombra e reacenda
   as constelações para devolver a luz ao mundo.
   Tudo em um único arquivo, sem dependências. Feito com <3.
   ========================================================================= */

/* ------------------------------------------------------------------ Canvas */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fog.width = canvas.width; fog.height = canvas.height;
}
const fog = document.createElement('canvas');
const fctx = fog.getContext('2d');

/* ------------------------------------------------------------------- Utils */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp = (a,b,t)=> a+(b-a)*t;
const rand = (a,b)=> a+Math.random()*(b-a);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const now = ()=> performance.now()/1000;

/* -------------------------------------------------------------------- Audio */
const Audio = (()=>{
  let ac=null, master=null, muted=false, droneNodes=null;
  function ensure(){
    if(ac) return;
    try{
      ac = new (window.AudioContext||window.webkitAudioContext)();
      master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
    }catch(e){ ac=null; }
  }
  function resume(){ ensure(); if(ac && ac.state==='suspended') ac.resume(); }
  function beep(freq, dur, type='sine', vol=0.3, when=0, slideTo=null){
    if(!ac||muted) return;
    const t = ac.currentTime + when;
    const o = ac.createOscillator(); const g = ac.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t+dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
  }
  function chord(freqs, dur, type='triangle', vol=0.22){
    freqs.forEach((f,i)=> beep(f,dur,type,vol, i*0.06));
  }
  const S = {
    jump(){ beep(440, 0.16,'square',0.14,0,720); },
    dbljump(){ beep(620, 0.16,'square',0.14,0,980); },
    collect(){ beep(880,0.10,'sine',0.22,0,1320); beep(1320,0.12,'sine',0.18,0.06); },
    pulse(){ beep(300,0.22,'sawtooth',0.10,0,120); beep(900,0.18,'sine',0.12,0); },
    hurt(){ beep(200,0.28,'sawtooth',0.20,0,70); },
    shadow(){ beep(140,0.25,'sawtooth',0.14,0,60); },
    checkpoint(){ chord([523,659,784],0.4,'triangle',0.16); },
    goal(){ chord([523,659,784,1047],0.6,'triangle',0.20); },
    win(){ chord([523,659,784,1047,1319],1.1,'triangle',0.20); },
    ui(){ beep(660,0.06,'square',0.10); },
  };
  function toggleMute(){ muted=!muted; if(muted) stopDrone(); else startDrone(); return muted; }
  function isMuted(){ return muted; }
  function startDrone(){
    if(!ac||muted||droneNodes) return;
    const g = ac.createGain(); g.gain.value=0.0; g.connect(master);
    g.gain.linearRampToValueAtTime(0.06, ac.currentTime+3);
    const o1=ac.createOscillator(); o1.type='sine'; o1.frequency.value=110;
    const o2=ac.createOscillator(); o2.type='sine'; o2.frequency.value=110*1.5;
    const lfo=ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.08;
    const lg=ac.createGain(); lg.gain.value=6; lfo.connect(lg); lg.connect(o2.frequency);
    o1.connect(g); o2.connect(g); o1.start(); o2.start(); lfo.start();
    droneNodes={g,o1,o2,lfo};
  }
  function stopDrone(){
    if(!droneNodes) return;
    try{ droneNodes.g.gain.linearRampToValueAtTime(0.0001, ac.currentTime+0.6);
      const n=droneNodes; setTimeout(()=>{try{n.o1.stop();n.o2.stop();n.lfo.stop();}catch(e){}},700);
    }catch(e){}
    droneNodes=null;
  }
  return { resume, S, toggleMute, isMuted, startDrone, stopDrone };
})();

/* ------------------------------------------------------------------- Input */
const keys = {};
const pressed = {};
const mouse = { x:0, y:0, down:false, clicked:false };
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  if(!keys[k]) pressed[k]=true;
  keys[k]=true;
  Audio.resume();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
canvas.addEventListener('mousemove', e=>{ const r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
canvas.addEventListener('mousedown', e=>{ mouse.down=true; mouse.clicked=true; Audio.resume(); });
window.addEventListener('mouseup', ()=>{ mouse.down=false; });
// touch (basic): tap = jump/confirm, drag = move
const touch = { active:false, startX:0, curX:0, tapped:false };
canvas.addEventListener('touchstart', e=>{ e.preventDefault(); Audio.resume(); const t=e.touches[0]; touch.active=true; touch.startX=t.clientX; touch.curX=t.clientX; touch.tapped=true; mouse.clicked=true; const r=canvas.getBoundingClientRect(); mouse.x=t.clientX-r.left; mouse.y=t.clientY-r.top; }, {passive:false});
canvas.addEventListener('touchmove', e=>{ e.preventDefault(); const t=e.touches[0]; touch.curX=t.clientX; }, {passive:false});
canvas.addEventListener('touchend', e=>{ e.preventDefault(); touch.active=false; }, {passive:false});
function consumePressed(k){ if(pressed[k]){ pressed[k]=false; return true;} return false; }
function anyConfirm(){
  let c = consumePressed('enter')||consumePressed(' ')||consumePressed('e');
  if(mouse.clicked){ c=true; }
  return c;
}

/* ------------------------------------------------------- Particle system */
const particles = [];
function spawnParticle(x,y,opt={}){
  particles.push(Object.assign({
    x,y, vx:rand(-30,30), vy:rand(-30,30), life:1, max:1,
    size:rand(2,4), color:'#fff', glow:true, grav:0
  }, opt));
}
function burst(x,y,n,color,opt={}){
  for(let i=0;i<n;i++){
    const a=rand(0,Math.PI*2), s=rand(opt.smin||40, opt.smax||160);
    spawnParticle(x,y,Object.assign({vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:rand(0.4,0.9), max:0.9, size:rand(1.5,3.5), color},opt));
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.life-=dt; if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy += (p.grav||0)*dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1-1.5*dt); p.vy *= (1-1.5*dt);
  }
}
function drawParticles(cam){
  ctx.save();
  for(const p of particles){
    const a = clamp(p.life/p.max,0,1);
    const sx=p.x-cam.x, sy=p.y-cam.y;
    ctx.globalAlpha=a;
    if(p.glow){ ctx.shadowColor=p.color; ctx.shadowBlur=10; }
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(sx,sy,p.size,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

const game = {
  levelIndex:0,
  level:null,
  player:null,
  cam:{x:0,y:0},
  fragments:[], enemies:[], checkpoints:[], movers:[],
  fragTotal:0, fragGot:0,
  respawn:{x:0,y:0},
  goalOpen:false, goalObj:null,
  time:0,
  transition:0, transDir:0, transCb:null,
  constAnim:0,
  shake:0,
  bgStars:[],
};

/* ------------------------------------------------------------- Player */
function makePlayer(x,y){
  return {
    x,y, w:24,h:24, vx:0, vy:0,
    onGround:false, coyote:0, jumpBuf:0, jumps:0,
    facing:1, light:100, maxLight:100,
    pulseCd:0, pulseR:0, pulseActive:false, pulseMax:260,
    hurtT:0, dead:false, trail:0, bob:0, spawnGlow:1,
  };
}

/* ----------------------------------------------------- Level bootstrap */
function loadLevel(i){
  const L = LEVELS[i];
  game.level = L;
  game.levelIndex = i;
  game.player = makePlayer(L.spawn.x, L.spawn.y);
  game.respawn = {x:L.spawn.x, y:L.spawn.y};
  game.fragments = L.fragments.map(f=>({x:f.x,y:f.y,got:false,ph:rand(0,6.28)}));
  game.fragTotal = game.fragments.length;
  game.fragGot = 0;
  game.enemies = L.enemies.map(e=>({x:e.x,y:e.y,type:e.type,ph:rand(0,6.28),alive:true,vx:0,vy:0,ox:e.x,oy:e.y}));
  game.checkpoints = (L.checkpoints||[]).map(c=>({x:c.x,y:c.y,active:false,ph:rand(0,6.28)}));
  game.movers = (L.moving||[]).map(m=>Object.assign({},m,{cx:m.x,cy:m.y}));
  game.goalOpen = false;
  game.goalObj = {x:L.goal.x, y:L.goal.y, ph:0};
  game.time = 0;
  game.constAnim = 0;
  game.cam.x = clamp(game.player.x - W/2, 0, L.bounds.w - W);
  game.cam.y = clamp(game.player.y - H/2, 0, L.bounds.h - H);
  particles.length = 0;
  // parallax stars
  game.bgStars = [];
  for(let s=0;s<160;s++){
    game.bgStars.push({ x:rand(0,L.bounds.w), y:rand(0,L.bounds.h), z:rand(0.2,0.8), r:rand(0.6,2.0), ph:rand(0,6.28) });
  }
}

/* -------------------------------------------------------- Collision */
function solids(){
  const arr = game.level.platforms.slice();
  for(const m of game.movers) arr.push({x:m.cx,y:m.cy,w:m.w,h:m.h, mover:m});
  return arr;
}
function aabb(ax,ay,aw,ah,bx,by,bw,bh){
  return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by;
}

/* -------------------------------------------------------- Update play */
function updatePlay(dt){
  const L=game.level, p=game.player;
  game.time += dt;

  // movers
  for(const m of game.movers){
    m.t += dt;
    if(m.axis==='x'){
      const span=(m.bx-m.ax);
      const nx = m.ax + (Math.sin(m.t*m.speed/Math.max(1,Math.abs(span)))*0.5+0.5)*span;
      m.dx = nx-m.cx; m.cx=nx;
    } else {
      const span=(m.by-m.ay);
      const ny = m.ay + (Math.sin(m.t*m.speed/Math.max(1,Math.abs(span)))*0.5+0.5)*span;
      m.dy = ny-m.cy; m.cy=ny;
    }
  }

  // ---- input ----
  let ix = 0;
  if(keys['a']||keys['arrowleft']) ix-=1;
  if(keys['d']||keys['arrowright']) ix+=1;
  // touch drag movement
  if(touch.active){
    const d = touch.curX - touch.startX;
    if(Math.abs(d)>16) ix = d>0?1:-1;
  }
  if(ix!==0) p.facing = ix;

  const ACC = 2600, MAXV = 320, FRIC = 2000;
  if(ix!==0){ p.vx += ix*ACC*dt; }
  else { const s=Math.sign(p.vx); p.vx -= s*Math.min(Math.abs(p.vx), FRIC*dt); }
  p.vx = clamp(p.vx, -MAXV, MAXV);

  // gravity
  const G = 2200, MAXFALL=900;
  p.vy += G*dt; if(p.vy>MAXFALL) p.vy=MAXFALL;

  // jump (with coyote + buffer)
  const jumpKey = consumePressed(' ')||consumePressed('w')||consumePressed('arrowup')|| (touch.tapped);
  touch.tapped=false;
  if(jumpKey) p.jumpBuf = 0.12;
  p.jumpBuf = Math.max(0, p.jumpBuf-dt);
  p.coyote = Math.max(0, p.coyote-dt);

  const JV = 760;
  if(p.jumpBuf>0){
    if(p.onGround || p.coyote>0){
      p.vy = -JV; p.onGround=false; p.coyote=0; p.jumpBuf=0; p.jumps=1;
      Audio.S.jump(); burst(p.x,p.y+p.h/2,8,'#bff', {smin:20,smax:80,grav:200});
    } else if(p.jumps<2){
      p.vy = -JV*0.92; p.jumps=2; p.jumpBuf=0;
      Audio.S.dbljump(); burst(p.x,p.y,10,L.accent,{smin:30,smax:120});
    }
  }

  // pulse ability
  p.pulseCd = Math.max(0, p.pulseCd-dt);
  const pulseKey = consumePressed('shift')||consumePressed('j')||consumePressed('k');
  if(pulseKey && p.pulseCd<=0 && p.light>10){
    p.pulseActive=true; p.pulseR=0; p.pulseCd=1.1; p.light=Math.max(0,p.light-8);
    Audio.S.pulse();
  }
  if(p.pulseActive){
    p.pulseR += 900*dt;
    if(p.pulseR>=p.pulseMax){ p.pulseActive=false; p.pulseR=0; }
  }

  // ---- integrate + collide ----
  p.x += p.vx*dt;
  const sol = solids();
  for(const s of sol){
    if(aabb(p.x-p.w/2,p.y-p.h/2,p.w,p.h, s.x,s.y,s.w,s.h)){
      if(p.vx>0) p.x = s.x - p.w/2;
      else if(p.vx<0) p.x = s.x+s.w + p.w/2;
      p.vx=0;
    }
  }
  const wasGround = p.onGround;
  p.onGround=false;
  p.y += p.vy*dt;
  for(const s of sol){
    if(aabb(p.x-p.w/2,p.y-p.h/2,p.w,p.h, s.x,s.y,s.w,s.h)){
      if(p.vy>0){ p.y = s.y - p.h/2; p.vy=0; p.onGround=true;
        if(s.mover && s.mover.dx) p.x += s.mover.dx;
        if(s.mover && s.mover.dy) p.y += s.mover.dy;
      } else if(p.vy<0){ p.y = s.y+s.h + p.h/2; p.vy=0; }
    }
  }
  if(p.onGround){ p.jumps=0; p.coyote=0.1; }
  else if(wasGround){ p.coyote=0.1; }

  // world bounds
  p.x = clamp(p.x, p.w/2, L.bounds.w - p.w/2);

  // trail particles
  p.trail -= dt;
  if(p.trail<=0){ p.trail=0.04; spawnParticle(p.x, p.y, {vx:rand(-10,10),vy:rand(-10,10),life:0.5,max:0.5,size:rand(2,4),color:L.accent}); }

  // hazards / fall
  let hurtByHazard=false;
  for(const hz of (L.hazards||[])){
    if(aabb(p.x-p.w/2,p.y-p.h/2,p.w,p.h, hz.x,hz.y,hz.w,hz.h)) hurtByHazard=true;
  }
  if(p.y > L.bounds.h + 60) hurtByHazard=true;
  if(hurtByHazard && p.hurtT<=0){ damagePlayer(35, true); }

  // fragments
  for(const f of game.fragments){
    if(f.got) continue;
    f.ph += dt*3;
    if(dist2(p.x,p.y,f.x,f.y) < 32*32){
      f.got=true; game.fragGot++;
      p.light = Math.min(p.maxLight, p.light+14);
      Audio.S.collect();
      burst(f.x,f.y,18,'#ffe98a',{smin:40,smax:180});
      if(game.fragGot>=game.fragTotal && !game.goalOpen){
        game.goalOpen=true; Audio.S.checkpoint();
        burst(game.goalObj.x, game.goalObj.y, 40, L.accent, {smin:60,smax:220});
      }
    }
  }

  // checkpoints
  for(const c of game.checkpoints){
    c.ph += dt*2;
    if(!c.active && dist2(p.x,p.y,c.x,c.y) < 40*40){
      c.active=true; game.respawn={x:c.x,y:c.y-30};
      Audio.S.checkpoint(); burst(c.x,c.y,24,'#8fffd0',{smin:40,smax:160});
    }
  }

  // enemies
  for(const e of game.enemies){
    if(!e.alive) continue;
    e.ph += dt*2;
    const d2 = dist2(p.x,p.y,e.x,e.y);
    if(e.type==='chase'){
      const d = Math.sqrt(d2)||1;
      const spd = 90;
      e.vx = lerp(e.vx, ((p.x-e.x)/d)*spd, dt*2);
      e.vy = lerp(e.vy, ((p.y-e.y)/d)*spd, dt*2);
      e.x += e.vx*dt; e.y += e.vy*dt;
    } else {
      e.x = e.ox + Math.sin(e.ph)*70;
      e.y = e.oy + Math.cos(e.ph*0.7)*24;
    }
    // pulse kills shadows
    if(p.pulseActive){
      const rr = p.pulseR;
      if(d2 < rr*rr && d2 > (rr-60)*(rr-60)){
        e.alive=false; Audio.S.shadow();
        burst(e.x,e.y,26,'#a06bff',{smin:40,smax:200});
        addLightSpark(e.x,e.y);
      }
    }
    // contact hurts
    if(e.alive && d2 < 28*28 && p.hurtT<=0){
      damagePlayer(22,false);
      const d=Math.sqrt(d2)||1;
      p.vx += ((p.x-e.x)/d)*300; p.vy = -260;
    }
  }

  // goal
  if(game.goalOpen){
    game.goalObj.ph += dt*3;
    if(dist2(p.x,p.y,game.goalObj.x,game.goalObj.y) < 40*40){
      completeLevel();
    }
  }

  // hurt timer
  p.hurtT = Math.max(0, p.hurtT-dt);

  // death by darkness
  if(p.light<=0 && !p.dead){
    p.dead=true;
    burst(p.x,p.y,40,'#88f',{smin:40,smax:220});
    setTimeout(()=>{ respawnPlayer(); }, 700);
  }
  p.spawnGlow = Math.max(0, p.spawnGlow - dt);
  p.bob += dt*6;

  // camera (smooth, look-ahead)
  const tx = clamp(p.x + p.vx*0.25 - W/2, 0, Math.max(0,L.bounds.w - W));
  const ty = clamp(p.y - H/2 - 20, 0, Math.max(0,L.bounds.h - H));
  game.cam.x = lerp(game.cam.x, tx, clamp(dt*6,0,1));
  game.cam.y = lerp(game.cam.y, ty, clamp(dt*6,0,1));
  if(game.shake>0){ game.shake=Math.max(0,game.shake-dt*4); }
}

function addLightSpark(x,y){
  for(let i=0;i<6;i++) spawnParticle(x,y,{vx:rand(-40,40),vy:rand(-120,-40),life:0.9,max:0.9,size:rand(2,3.5),color:'#ffe98a',grav:120});
}

function damagePlayer(amt, hazard){
  const p=game.player;
  if(p.hurtT>0||p.dead) return;
  p.light=Math.max(0,p.light-amt);
  p.hurtT=1.0; game.shake=1.0;
  Audio.S.hurt();
  burst(p.x,p.y,16,'#ff6b6b',{smin:40,smax:150});
  if(hazard){ p.vy=-320; }
}

function respawnPlayer(){
  const p=game.player;
  p.x=game.respawn.x; p.y=game.respawn.y;
  p.vx=0; p.vy=0; p.light=Math.max(55,p.light); p.dead=false; p.hurtT=0.6; p.spawnGlow=1;
  burst(p.x,p.y,24,game.level.accent,{smin:30,smax:140});
}

function completeLevel(){
  Audio.S.goal();
  state = GS.LEVEL_DONE;
  game.constAnim = 0;
  burst(game.goalObj.x, game.goalObj.y, 60, '#fff', {smin:80,smax:300});
}

/* --------------------------------------------------------- Rendering */
function drawBackground(){
  const L=game.level;
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, L.sky[0]); g.addColorStop(0.55, L.sky[1]); g.addColorStop(1, L.sky[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // parallax stars
  ctx.save();
  for(const s of game.bgStars){
    const sx = s.x - game.cam.x*s.z;
    const sy = s.y - game.cam.y*s.z;
    if(sx<-10||sx>W+10||sy<-10||sy>H+10) continue;
    const tw = 0.5+0.5*Math.sin(game.time*2 + s.ph);
    ctx.globalAlpha = (0.3+0.5*tw)*s.z;
    ctx.fillStyle = '#dfe8ff';
    ctx.beginPath(); ctx.arc(sx,sy,s.r*s.z*1.4,0,6.28); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha=1;
  // distant silhouette hills (parallax)
  ctx.save();
  ctx.globalAlpha=0.35; ctx.fillStyle=L.sky[2];
  const off = -game.cam.x*0.3;
  ctx.beginPath();
  ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=40){
    const y = H*0.62 + Math.sin((x-off)*0.004)*60 + Math.sin((x-off)*0.011)*30;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawPlatform(s, cam){
  const L=game.level;
  const x=s.x-cam.x, y=s.y-cam.y;
  ctx.fillStyle=L.ground;
  roundRect(x,y,s.w,s.h,6); ctx.fill();
  // top edge
  ctx.fillStyle=L.groundTop;
  roundRect(x,y,s.w,Math.min(10,s.h),6); ctx.fill();
  ctx.save(); ctx.globalAlpha=0.25; ctx.fillStyle='#000';
  ctx.fillRect(x,y+Math.min(10,s.h),s.w,Math.max(0,s.h-10)); ctx.restore();
}

function drawWorld(){
  const cam=game.cam, L=game.level;
  // platforms
  for(const s of L.platforms) drawPlatform(s,cam);
  for(const m of game.movers) drawPlatform({x:m.cx,y:m.cy,w:m.w,h:m.h}, cam);
  // hazards
  for(const hz of (L.hazards||[])){
    const x=hz.x-cam.x, y=hz.y-cam.y;
    ctx.save(); ctx.fillStyle='#12000f';
    ctx.fillRect(x,y,hz.w,hz.h);
    ctx.fillStyle='rgba(160,40,120,0.5)';
    for(let sx=0; sx<hz.w; sx+=16){
      ctx.beginPath(); ctx.moveTo(x+sx,y+hz.h); ctx.lineTo(x+sx+8,y+2); ctx.lineTo(x+sx+16,y+hz.h); ctx.fill();
    }
    ctx.restore();
  }
  // checkpoints (lanterns)
  for(const c of game.checkpoints){
    const x=c.x-cam.x, y=c.y-cam.y;
    const glow = c.active? 1 : 0.35;
    ctx.save();
    ctx.shadowColor = c.active? '#8fffd0':'#456';
    ctx.shadowBlur = c.active? 26:8;
    ctx.fillStyle = c.active? '#8fffd0':'#33465a';
    const s = 8 + (c.active? Math.sin(c.ph)*2:0);
    ctx.beginPath(); ctx.arc(x,y-20,s,0,6.28); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = c.active? 'rgba(143,255,208,0.6)':'rgba(80,100,120,0.5)';
    ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x,y-12); ctx.lineTo(x,y+8); ctx.stroke();
  }
  // fragments
  for(const f of game.fragments){
    if(f.got) continue;
    const x=f.x-cam.x, y=f.y-cam.y + Math.sin(f.ph)*4;
    ctx.save();
    ctx.shadowColor='#ffe98a'; ctx.shadowBlur=22;
    ctx.fillStyle='#fff6cf';
    star(x,y,4,10,5, f.ph*0.5);
    ctx.fill();
    ctx.restore();
  }
  // goal (fallen star / beacon)
  const gx=game.goalObj.x-cam.x, gy=game.goalObj.y-cam.y;
  if(game.goalOpen){
    // beam
    ctx.save();
    const bg=ctx.createLinearGradient(gx,gy,gx,gy-H);
    bg.addColorStop(0,'rgba(255,255,220,0.5)'); bg.addColorStop(1,'rgba(255,255,220,0)');
    ctx.fillStyle=bg; ctx.fillRect(gx-24,gy-H,48,H);
    ctx.shadowColor='#fff'; ctx.shadowBlur=40; ctx.fillStyle='#fff8dc';
    star(gx,gy,10,26,5, game.goalObj.ph); ctx.fill();
    ctx.restore();
  } else {
    ctx.save(); ctx.globalAlpha=0.5;
    ctx.strokeStyle=L.accent; ctx.lineWidth=2;
    star(gx,gy,8,20,5, game.time); ctx.stroke();
    ctx.restore();
  }
  // enemies (shadows)
  for(const e of game.enemies){
    if(!e.alive) continue;
    const x=e.x-cam.x, y=e.y-cam.y;
    ctx.save();
    ctx.shadowColor='#6a3bd0'; ctx.shadowBlur=18;
    ctx.fillStyle='#1a0a2e';
    const r=14+Math.sin(e.ph*1.5)*2;
    ctx.beginPath();
    for(let a=0;a<6.28;a+=0.5){
      const rr = r + Math.sin(a*3+e.ph*2)*3;
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    // eyes
    ctx.fillStyle='#c79bff'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(x-4,y-2,2.2,0,6.28); ctx.arc(x+4,y-2,2.2,0,6.28); ctx.fill();
    ctx.restore();
  }
  // pulse ring
  const p=game.player;
  if(p.pulseActive){
    ctx.save();
    const px=p.x-cam.x, py=p.y-cam.y;
    ctx.globalAlpha = clamp(1 - p.pulseR/p.pulseMax,0,1);
    ctx.strokeStyle=L.accent; ctx.lineWidth=5; ctx.shadowColor=L.accent; ctx.shadowBlur=24;
    ctx.beginPath(); ctx.arc(px,py,p.pulseR,0,6.28); ctx.stroke();
    ctx.restore();
  }
  // player
  drawPlayer();
  // particles
  drawParticles(cam);
}

function star(cx,cy,rIn,rOut,pts,rot){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const r = i%2? rIn:rOut;
    const a = (i/(pts*2))*Math.PI*2 + (rot||0);
    const x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

function drawPlayer(){
  const p=game.player, cam=game.cam, L=game.level;
  const x=p.x-cam.x, y=p.y-cam.y + Math.sin(p.bob)*2;
  if(p.dead) return;
  ctx.save();
  const flick = p.hurtT>0 ? (Math.sin(p.hurtT*40)>0?0.4:1) : 1;
  ctx.globalAlpha = flick;
  // outer aura
  const auraR = 26 + Math.sin(p.bob*0.7)*3 + p.light*0.12;
  const ag=ctx.createRadialGradient(x,y,2,x,y,auraR);
  ag.addColorStop(0,'rgba(255,255,240,0.9)');
  ag.addColorStop(0.4, hexA(L.accent,0.5));
  ag.addColorStop(1, hexA(L.accent,0));
  ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(x,y,auraR,0,6.28); ctx.fill();
  // wings/tails
  ctx.fillStyle = hexA(L.accent,0.5);
  for(let i=0;i<3;i++){
    const a = Math.PI + p.facing*(0.4) + i*0.5*p.facing + Math.sin(p.bob+i)*0.1;
    const tx = x - p.facing*(10+i*6), ty = y + Math.sin(p.bob*1.5+i)*4;
    ctx.beginPath(); ctx.ellipse(tx,ty, 6-i*1.4, 3, a, 0,6.28); ctx.fill();
  }
  // core
  ctx.shadowColor='#fff'; ctx.shadowBlur=20;
  ctx.fillStyle='#fffef0';
  ctx.beginPath(); ctx.arc(x,y,9,0,6.28); ctx.fill();
  // eyes (cute)
  ctx.shadowBlur=0; ctx.fillStyle='#22304a';
  ctx.beginPath();
  ctx.arc(x-3+p.facing*2,y-1,1.6,0,6.28);
  ctx.arc(x+3+p.facing*2,y-1,1.6,0,6.28);
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha=1; ctx.shadowBlur=0;
}

function hexA(hex,a){
  const h=hex.replace('#',''); const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ------------------------------------------------------- Darkness fog */
function drawFog(){
  const L=game.level, cam=game.cam, p=game.player;
  fctx.setTransform(DPR,0,0,DPR,0,0);
  fctx.clearRect(0,0,W,H);
  fctx.fillStyle = `rgba(3,4,12,${L.darkness})`;
  fctx.fillRect(0,0,W,H);
  fctx.globalCompositeOperation='destination-out';
  function hole(wx,wy,radius,strength){
    const x=wx-cam.x, y=wy-cam.y;
    const g=fctx.createRadialGradient(x,y,0,x,y,radius);
    g.addColorStop(0,`rgba(0,0,0,${strength})`);
    g.addColorStop(0.7,`rgba(0,0,0,${strength*0.5})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    fctx.fillStyle=g; fctx.beginPath(); fctx.arc(x,y,radius,0,6.28); fctx.fill();
  }
  // player light (main)
  const plr = 150 + p.light*1.6 + Math.sin(p.bob*0.7)*8;
  hole(p.x,p.y, plr, 1);
  if(p.pulseActive) hole(p.x,p.y, p.pulseR+40, 0.8);
  // fragments glow
  for(const f of game.fragments){ if(!f.got) hole(f.x,f.y,90,0.85); }
  // checkpoints
  for(const c of game.checkpoints){ if(c.active) hole(c.x,c.y,120,0.8); }
  // goal
  if(game.goalOpen) hole(game.goalObj.x,game.goalObj.y,220,0.9);
  else hole(game.goalObj.x,game.goalObj.y,70,0.5);
  fctx.globalCompositeOperation='source-over';
  ctx.drawImage(fog,0,0,W,H);
}

/* ------------------------------------------------------------ HUD */
function drawHUD(){
  const p=game.player, L=game.level;
  // light bar
  const bw=220, bh=16, bx=20, by=20;
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.4)'; roundRect(bx-4,by-4,bw+8,bh+8,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)'; roundRect(bx,by,bw,bh,6); ctx.fill();
  const lw = bw*(p.light/p.maxLight);
  const lg=ctx.createLinearGradient(bx,0,bx+bw,0);
  lg.addColorStop(0,'#ffd27a'); lg.addColorStop(1,'#fff6cf');
  ctx.fillStyle=lg; ctx.shadowColor='#ffe98a'; ctx.shadowBlur=12;
  roundRect(bx,by,Math.max(0,lw),bh,6); ctx.fill();
  ctx.restore();
  ctx.fillStyle='#cfe'; ctx.font='12px Trebuchet MS';
  ctx.fillText('LUZ', bx, by+bh+16);

  // fragments
  ctx.save();
  ctx.font='bold 16px Trebuchet MS'; ctx.fillStyle='#fff6cf';
  ctx.textAlign='right';
  ctx.fillText(`✦ ${game.fragGot} / ${game.fragTotal}`, W-20, 34);
  ctx.font='12px Trebuchet MS'; ctx.fillStyle= game.goalOpen? '#8fffd0':'#9ab';
  ctx.fillText(game.goalOpen? 'Farol aberto — vá até ele!' : 'Reúna os fragmentos', W-20, 54);
  ctx.restore();
  ctx.textAlign='left';

  // pulse cooldown indicator
  const cdx=20, cdy=64;
  ctx.fillStyle= p.pulseCd<=0? '#8fffd0':'#556';
  ctx.font='12px Trebuchet MS';
  ctx.fillText(p.pulseCd<=0? '◎ PULSO pronto (Shift/J)' : `◎ Pulso… ${p.pulseCd.toFixed(1)}s`, cdx, cdy);

  // level name (top center, subtle)
  ctx.save();
  ctx.textAlign='center'; ctx.globalAlpha=0.6;
  ctx.font='13px Trebuchet MS'; ctx.fillStyle='#bcd';
  ctx.fillText(`${game.levelIndex+1}/5 · ${L.name}`, W/2, 26);
  ctx.restore(); ctx.textAlign='left';

  // hint bottom
  ctx.save(); ctx.globalAlpha=0.5; ctx.textAlign='center';
  ctx.font='12px Trebuchet MS'; ctx.fillStyle='#89a';
  ctx.fillText('← → mover · ESPAÇO pular (2x) · SHIFT pulso · ESC pausar · M som', W/2, H-16);
  ctx.restore(); ctx.textAlign='left';
}

/* ------------------------------------------------------- Screens (UI) */
function fillCenterText(lines, opts={}){
  ctx.textAlign='center';
  let y = opts.y || H*0.4;
  const lh = opts.lh || 30;
  for(const ln of lines){
    ctx.fillText(ln, W/2, y); y+=lh;
  }
  ctx.textAlign='left';
}

let titleT=0;
function drawTitle(){
  drawTitleBg();
  ctx.save();
  ctx.textAlign='center';
  // title glow
  const pulse = 0.7+0.3*Math.sin(titleT*1.5);
  ctx.shadowColor='#ffe98a'; ctx.shadowBlur=30*pulse;
  ctx.fillStyle='#fff6cf';
  ctx.font='bold 72px Trebuchet MS';
  ctx.fillText('LUMINA', W/2, H*0.34);
  ctx.shadowBlur=0;
  ctx.fillStyle='#9fc7e8'; ctx.font='20px Trebuchet MS';
  ctx.fillText('A Guardiã da Luz', W/2, H*0.34+34);

  // prompt
  const a = 0.5+0.5*Math.sin(titleT*3);
  ctx.globalAlpha=a; ctx.fillStyle='#fff'; ctx.font='22px Trebuchet MS';
  ctx.fillText('▶  Pressione ENTER ou clique para começar', W/2, H*0.62);
  ctx.globalAlpha=1;

  ctx.fillStyle='#7fa'; ctx.font='14px Trebuchet MS';
  ctx.fillText('← →  mover    ·    ESPAÇO  pular (duplo)    ·    SHIFT/J  pulso de luz', W/2, H*0.72);
  ctx.fillStyle='#678'; ctx.font='13px Trebuchet MS';
  ctx.fillText('Reúna os fragmentos de estrela · expulse a Sombra · reacenda o céu', W/2, H*0.72+24);
  ctx.fillStyle='#456'; ctx.font='12px Trebuchet MS';
  ctx.fillText('M: liga/desliga som', W/2, H-24);
  ctx.restore(); ctx.textAlign='left';
}

// A little floating Lumina on the title
let titleStars=null;
function drawTitleBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05060f'); g.addColorStop(0.6,'#0a1226'); g.addColorStop(1,'#0f1c3a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(!titleStars){ titleStars=[]; for(let i=0;i<200;i++) titleStars.push({x:Math.random(),y:Math.random(),r:rand(0.5,2),ph:rand(0,6.28),z:rand(0.2,1)}); }
  for(const s of titleStars){
    const tw=0.4+0.6*(0.5+0.5*Math.sin(titleT*2+s.ph));
    ctx.globalAlpha=tw*s.z; ctx.fillStyle='#dfe8ff';
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,Math.max(0.1,s.r*tw),0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
  // floating orb (Lumina)
  const ox=W/2, oy=H*0.46+Math.sin(titleT)*10;
  const ag=ctx.createRadialGradient(ox,oy,2,ox,oy,60);
  ag.addColorStop(0,'rgba(255,255,240,0.9)'); ag.addColorStop(0.4,'rgba(255,220,140,0.4)'); ag.addColorStop(1,'rgba(255,220,140,0)');
  ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(ox,oy,60,0,6.28); ctx.fill();
  ctx.shadowColor='#fff'; ctx.shadowBlur=24; ctx.fillStyle='#fffef0';
  ctx.beginPath(); ctx.arc(ox,oy,10,0,6.28); ctx.fill(); ctx.shadowBlur=0;
}

function drawStory(){
  // dark starry bg
  drawTitleBg();
  const page = storyList[storyPage];
  ctx.save();
  ctx.textAlign='center';
  ctx.shadowColor='#ffe98a'; ctx.shadowBlur=16; ctx.fillStyle='#fff6cf';
  ctx.font='bold 44px Trebuchet MS';
  ctx.fillText(page.title, W/2, H*0.34);
  ctx.shadowBlur=0;
  ctx.fillStyle='#cfe0f0'; ctx.font='20px Trebuchet MS';
  let y=H*0.46;
  for(const ln of page.lines){ ctx.fillText(ln, W/2, y); y+=32; }
  const a=0.4+0.6*Math.sin(titleT*3);
  ctx.globalAlpha=a; ctx.fillStyle='#8fb'; ctx.font='16px Trebuchet MS';
  ctx.fillText(storyPage<storyList.length-1? '▶ ENTER / clique para continuar' : '▶ ENTER / clique para começar', W/2, H*0.8);
  ctx.globalAlpha=1;
  ctx.fillStyle='#456'; ctx.font='12px Trebuchet MS';
  ctx.fillText(`${storyPage+1} / ${storyList.length}`, W/2, H-24);
  ctx.restore(); ctx.textAlign='left';
}

let levelIntroT=0;
function drawLevelIntro(){
  // world dim behind
  drawBackground();
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
  const L=LEVELS[game.levelIndex];
  ctx.save(); ctx.textAlign='center';
  ctx.fillStyle='#89a'; ctx.font='16px Trebuchet MS';
  ctx.fillText(`CAPÍTULO ${game.levelIndex+1}`, W/2, H*0.3);
  ctx.shadowColor=L.accent; ctx.shadowBlur=20; ctx.fillStyle='#fff';
  ctx.font='bold 46px Trebuchet MS';
  ctx.fillText(L.name, W/2, H*0.38);
  ctx.shadowBlur=0;
  ctx.fillStyle=L.accent; ctx.font='italic 18px Trebuchet MS';
  ctx.fillText(L.subtitle, W/2, H*0.38+34);
  ctx.fillStyle='#cde'; ctx.font='16px Trebuchet MS';
  let y=H*0.55;
  for(const ln of LEVEL_STORIES[game.levelIndex]){ ctx.fillText(ln,W/2,y); y+=28; }
  const a=0.4+0.6*Math.sin(titleT*3);
  ctx.globalAlpha=a; ctx.fillStyle='#8fb'; ctx.font='18px Trebuchet MS';
  ctx.fillText('▶ ENTER / clique para começar', W/2, H*0.8);
  ctx.restore(); ctx.textAlign='left'; ctx.globalAlpha=1;
}

function drawLevelDone(){
  drawBackground();
  drawFog();
  ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H);
  const L=game.level, con=L.constellation;
  game.constAnim += 1/60;
  const t = game.constAnim;
  // draw constellation forming
  const cx=W/2, cy=H*0.45, scale=Math.min(W,H)*0.32;
  ctx.save();
  // edges appear over time
  const edgeProg = clamp((t-0.6)/1.8,0,1);
  ctx.strokeStyle=hexA(L.accent,0.7); ctx.lineWidth=2; ctx.shadowColor=L.accent; ctx.shadowBlur=10;
  const ne = con.edges.length;
  for(let i=0;i<ne;i++){
    const seg = edgeProg*ne - i;
    if(seg<=0) continue;
    const f=clamp(seg,0,1);
    const [a,b]=con.edges[i];
    const pa=con.pts[a], pb=con.pts[b];
    const x1=cx+(pa[0]-0.5)*scale*2, y1=cy+(pa[1]-0.5)*scale*2;
    const x2=cx+(pb[0]-0.5)*scale*2, y2=cy+(pb[1]-0.5)*scale*2;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lerp(x1,x2,f),lerp(y1,y2,f)); ctx.stroke();
  }
  // stars
  for(let i=0;i<con.pts.length;i++){
    const pp=con.pts[i];
    const x=cx+(pp[0]-0.5)*scale*2, y=cy+(pp[1]-0.5)*scale*2;
    const appear = clamp((t-i*0.08),0,1);
    if(appear<=0) continue;
    ctx.globalAlpha=appear;
    ctx.shadowColor='#fff'; ctx.shadowBlur=16; ctx.fillStyle='#fff6cf';
    star(x,y,2,6+2*Math.sin(t*3+i),5,t);
    ctx.fill();
  }
  ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0;

  ctx.textAlign='center';
  ctx.fillStyle='#89a'; ctx.font='15px Trebuchet MS';
  ctx.fillText('CONSTELAÇÃO REACESA', W/2, cy-scale-30);
  ctx.shadowColor=L.accent; ctx.shadowBlur=14; ctx.fillStyle='#fff';
  ctx.font='bold 34px Trebuchet MS';
  ctx.fillText(con.name, W/2, cy-scale);
  ctx.shadowBlur=0;
  if(t>2.4){
    const a=0.4+0.6*Math.sin(titleT*3);
    ctx.globalAlpha=a; ctx.fillStyle='#8fb'; ctx.font='18px Trebuchet MS';
    const last = game.levelIndex>=LEVELS.length-1;
    ctx.fillText(last? '▶ ENTER / clique para o amanhecer' : '▶ ENTER / clique para o próximo capítulo', W/2, H*0.82);
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left';
}

function drawPause(){
  drawBackground(); drawWorld(); drawFog(); drawHUD();
  ctx.fillStyle='rgba(0,0,10,0.6)'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.textAlign='center';
  ctx.fillStyle='#fff'; ctx.font='bold 48px Trebuchet MS';
  ctx.fillText('Pausado', W/2, H*0.42);
  ctx.fillStyle='#9cf'; ctx.font='18px Trebuchet MS';
  ctx.fillText('ENTER: continuar   ·   R: reiniciar capítulo   ·   M: som', W/2, H*0.52);
  ctx.fillStyle='#678'; ctx.font='14px Trebuchet MS';
  ctx.fillText(Audio.isMuted()? 'som: desligado':'som: ligado', W/2, H*0.6);
  ctx.restore(); ctx.textAlign='left';
}

/* --------------------------------------------------------- Transitions */
function startTransition(cb){
  game.transDir=1; game.transCb=cb;
}
function updateTransition(dt){
  if(game.transDir===1){
    game.transition += dt*2.2;
    if(game.transition>=1){ game.transition=1; if(game.transCb){game.transCb(); game.transCb=null;} game.transDir=-1; }
  } else if(game.transDir===-1){
    game.transition -= dt*2.2;
    if(game.transition<=0){ game.transition=0; game.transDir=0; }
  }
}
function drawTransition(){
  if(game.transition<=0) return;
  ctx.fillStyle=`rgba(0,0,4,${game.transition})`;
  ctx.fillRect(0,0,W,H);
}

/* ------------------------------------------------------ Flow control */
function goToLevel(i){
  startTransition(()=>{ loadLevel(i); state=GS.LEVEL_INTRO; levelIntroT=0; });
}
function startGame(){
  Audio.resume(); Audio.startDrone();
  storyList = STORY_INTRO; storyPage=0; state=GS.INTRO;
}
function nextAfterStory(){
  if(storyList===STORY_INTRO){ goToLevel(0); }
  else if(storyList===STORY_OUTRO){
    // back to title
    startTransition(()=>{ state=GS.TITLE; });
  }
}

/* ------------------------------------------------------------ Main loop */
let last = now();
function frame(){
  const t = now();
  let dt = t-last; last=t;
  dt = Math.min(dt, 1/30); // clamp
  titleT += dt; levelIntroT += dt;

  updateTransition(dt);
  const blocking = game.transDir!==0 && game.transition>0.5;

  // ---- state update ----
  if(state===GS.PLAY && !blocking){
    updatePlay(dt);
  }
  updateParticles(dt);

  // ---- state input ----
  handleStateInput();

  // ---- render ----
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // camera shake
  let shx=0, shy=0;
  if(state===GS.PLAY && game.shake>0){ shx=rand(-1,1)*game.shake*6; shy=rand(-1,1)*game.shake*6; }
  ctx.save();
  ctx.translate(shx,shy);

  switch(state){
    case GS.TITLE: drawTitle(); break;
    case GS.INTRO:
    case GS.OUTRO: drawStory(); break;
    case GS.LEVEL_INTRO: drawLevelIntro(); break;
    case GS.PLAY: drawBackground(); drawWorld(); drawFog(); drawHUD(); break;
    case GS.PAUSE: drawPause(); break;
    case GS.LEVEL_DONE: drawLevelDone(); break;
  }
  ctx.restore();
  drawTransition();

  // reset per-frame input latches
  mouse.clicked=false;

  requestAnimationFrame(frame);
}

function handleStateInput(){
  // global mute
  if(consumePressed('m')){ const m=Audio.toggleMute(); if(!m) Audio.startDrone(); Audio.S.ui(); }

  if(state===GS.TITLE){
    if(anyConfirm()){ Audio.S.ui(); startGame(); }
  }
  else if(state===GS.INTRO || state===GS.OUTRO){
    if(anyConfirm()){
      Audio.S.ui();
      if(storyPage<storyList.length-1) storyPage++;
      else nextAfterStory();
    }
  }
  else if(state===GS.LEVEL_INTRO){
    if(anyConfirm() && levelIntroT>0.4){ Audio.S.ui(); state=GS.PLAY; }
  }
  else if(state===GS.PLAY){
    if(consumePressed('escape')||consumePressed('p')){ state=GS.PAUSE; }
  }
  else if(state===GS.PAUSE){
    if(consumePressed('escape')||consumePressed('enter')||consumePressed('p')){ state=GS.PLAY; }
    if(consumePressed('r')){ startTransition(()=>{ loadLevel(game.levelIndex); state=GS.PLAY; }); }
  }
  else if(state===GS.LEVEL_DONE){
    if(game.constAnim>2.4 && anyConfirm()){
      Audio.S.ui();
      if(game.levelIndex>=LEVELS.length-1){
        startTransition(()=>{ storyList=STORY_OUTRO; storyPage=0; state=GS.OUTRO; Audio.S.win(); });
      } else {
        goToLevel(game.levelIndex+1);
      }
    }
  }
}

/* ------------------------------------------------------------- Boot */
window.addEventListener('resize', resize);
resize();
document.getElementById('loading').style.display='none';
requestAnimationFrame(frame);
</script>
