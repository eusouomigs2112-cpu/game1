<title>LUMINA — A Guardiã da Luz (1ª pessoa)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#04050b; }
  body { font-family:'Trebuchet MS','Segoe UI',sans-serif; color:#eef; }
  #game { display:block; width:100vw; height:100vh; touch-action:none; cursor:crosshair; }
  #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#04050b; color:#8fa; font-size:20px; letter-spacing:2px; z-index:10; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">acendendo a última centelha…</div>
<script>
"use strict";
/* =========================================================================
   LUMINA — A Guardiã da Luz  ·  Edição em Primeira Pessoa
   Engine de raycasting em canvas puro (sem dependências).
   Você é a última centelha viva. Caminhe pela escuridão, deixe sua luz
   revelar o mundo, reúna os fragmentos de estrela, disperse a Sombra com
   o Pulso de Luz e reacenda as constelações para devolver o amanhecer.
   ========================================================================= */

/* ----------------------------------------------------------------- Canvas */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha:false });
let W=0, H=0, DPR=1, numRays=0;
const COLW = 2; // largura de cada coluna do raycaster (px de tela)
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 1.75);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR); canvas.height = Math.floor(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  numRays = Math.ceil(W/COLW);
}

/* ------------------------------------------------------------------ Utils */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>a+Math.random()*(b-a);
const now=()=>performance.now()/1000;
const TAU=Math.PI*2;

/* ------------------------------------------------------------------- Audio */
const Audio=(()=>{
  let ac=null,master=null,muted=false,drone=null;
  function ensure(){ if(ac)return; try{ ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=0.55; master.connect(ac.destination);}catch(e){ac=null;} }
  function resume(){ ensure(); if(ac&&ac.state==='suspended') ac.resume(); }
  function beep(f,d,t='sine',v=0.3,when=0,slide=null){ if(!ac||muted)return;
    const s=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();
    o.type=t;o.frequency.setValueAtTime(f,s); if(slide)o.frequency.exponentialRampToValueAtTime(slide,s+d);
    g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v,s+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,s+d); o.connect(g);g.connect(master);o.start(s);o.stop(s+d+0.02);}
  function chord(fs,d,t='triangle',v=0.2){ fs.forEach((f,i)=>beep(f,d,t,v,i*0.06)); }
  const S={
    step(){ beep(90,0.06,'sine',0.05,0,60); },
    collect(){ beep(880,0.1,'sine',0.22,0,1320); beep(1320,0.12,'sine',0.16,0.06); },
    pulse(){ beep(300,0.25,'sawtooth',0.1,0,110); beep(900,0.2,'sine',0.12); },
    hurt(){ beep(200,0.3,'sawtooth',0.2,0,70); },
    shadow(){ beep(140,0.25,'sawtooth',0.14,0,60); },
    open(){ chord([523,659,784],0.4,'triangle',0.16); },
    goal(){ chord([523,659,784,1047],0.6,'triangle',0.2); },
    win(){ chord([523,659,784,1047,1319],1.1,'triangle',0.2); },
    ui(){ beep(660,0.06,'square',0.1); },
  };
  function toggleMute(){ muted=!muted; if(muted)stopDrone(); else startDrone(); return muted; }
  function isMuted(){ return muted; }
  function startDrone(){ if(!ac||muted||drone)return;
    const g=ac.createGain(); g.gain.value=0; g.connect(master);
    g.gain.linearRampToValueAtTime(0.05,ac.currentTime+3);
    const o1=ac.createOscillator();o1.type='sine';o1.frequency.value=98;
    const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=147;
    const lfo=ac.createOscillator();lfo.type='sine';lfo.frequency.value=0.07;
    const lg=ac.createGain();lg.gain.value=5;lfo.connect(lg);lg.connect(o2.frequency);
    o1.connect(g);o2.connect(g);o1.start();o2.start();lfo.start(); drone={g,o1,o2,lfo}; }
  function stopDrone(){ if(!drone)return; try{ drone.g.gain.linearRampToValueAtTime(0.0001,ac.currentTime+0.6);
    const n=drone; setTimeout(()=>{try{n.o1.stop();n.o2.stop();n.lfo.stop();}catch(e){}},700);}catch(e){} drone=null; }
  return { resume, S, toggleMute, isMuted, startDrone, stopDrone };
})();

/* ------------------------------------------------------------------- Input */
const keys={}, pressed={};
const mouse={ dx:0, locked:false, clicked:false };
window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k)) e.preventDefault();
  if(!keys[k]) pressed[k]=true; keys[k]=true; Audio.resume(); });
window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
canvas.addEventListener('mousedown',()=>{ mouse.clicked=true; Audio.resume();
  if(state===GS.PLAY && !mouse.locked){ try{canvas.requestPointerLock();}catch(e){} } });
document.addEventListener('pointerlockchange',()=>{ mouse.locked = (document.pointerLockElement===canvas); });
document.addEventListener('mousemove',e=>{ if(mouse.locked) mouse.dx += e.movementX||0; });
function consume(k){ if(pressed[k]){ pressed[k]=false; return true; } return false; }
function confirmPressed(){ let c=consume('enter')||consume(' ')||consume('e'); if(mouse.clicked)c=true; return c; }

// Touch (mobile): tocar = andar pra frente; arrastar horizontal = girar; toque rápido = pulso/confirmar
const tch={ active:false, id:null, lx:0, x0:0, y0:0, t0:0, moved:0 };
canvas.addEventListener('touchstart',e=>{ e.preventDefault(); Audio.resume(); const t=e.changedTouches[0];
  tch.active=true; tch.id=t.identifier; tch.lx=t.clientX; tch.x0=t.clientX; tch.y0=t.clientY; tch.t0=now(); tch.moved=0; mouse.clicked=true; },{passive:false});
canvas.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier===tch.id){
  mouse.dx += (t.clientX - tch.lx)*1.4; tch.moved += Math.abs(t.clientX-tch.lx); tch.lx=t.clientX; } } },{passive:false});
canvas.addEventListener('touchend',e=>{ e.preventDefault(); for(const t of e.changedTouches){ if(t.identifier===tch.id){
  const quick = (now()-tch.t0)<0.25 && tch.moved<20;
  if(quick && state===GS.PLAY){ tryPulse(); }
  tch.active=false; tch.id=null; } } },{passive:false});

/* ---------------------------------------------------------------- Particles */
/* Partículas em espaço de tela (para flashes/HUD). O mundo 3D usa sprites. */
const fx=[];
function fxBurst(x,y,n,color){ for(let i=0;i<n;i++){ const a=rand(0,TAU),s=rand(40,220);
  fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(0.4,0.9),max:0.9,size:rand(1.5,3.5),color}); } }
function fxUpdate(dt){ for(let i=fx.length-1;i>=0;i--){ const p=fx[i]; p.life-=dt; if(p.life<=0){fx.splice(i,1);continue;}
  p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=(1-2*dt); p.vy*=(1-2*dt); } }
function fxDraw(){ ctx.save(); for(const p of fx){ const a=clamp(p.life/p.max,0,1); ctx.globalAlpha=a;
  ctx.shadowColor=p.color; ctx.shadowBlur=10; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0; }

/* ------------------------------------------------------------- Game state */
const GS={ TITLE:'title', INTRO:'intro', LEVEL_INTRO:'levelIntro', PLAY:'play',
  PAUSE:'pause', LEVEL_DONE:'levelDone', OUTRO:'outro' };
let state=GS.TITLE, storyPage=0, storyList=null;

const game={
  levelIndex:0, L:null, grid:null, gw:0, gh:0,
  p:{ x:2, y:2, ang:0, light:100, maxLight:100, pulseCd:0, pulseT:0, bob:0, hurtT:0, dead:false },
  fragments:[], enemies:[], goal:null,
  fragTotal:0, fragGot:0, goalOpen:false,
  spawn:{x:2,y:2,ang:0},
  zbuf:null, time:0, shake:0,
  trans:0, transDir:0, transCb:null, constAnim:0, walkT:0,
};

/* --------------------------------------------------------- Level bootstrap */
function parseLevel(i){
  const L=LEVELS[i]; const g=L.grid;
  game.L=L; game.levelIndex=i;
  game.gh=g.length; game.gw=g[0].length;
  game.grid=g.map(r=>r.split('').map(c=>c==='#'?1:0));
  game.fragments=[]; game.enemies=[]; game.goal=null;
  for(let y=0;y<g.length;y++){ for(let x=0;x<g[y].length;x++){ const c=g[y][x];
    const cx=x+0.5, cy=y+0.5;
    if(c==='P'){ game.spawn={x:cx,y:cy,ang:L.face||0}; }
    else if(c==='*'){ game.fragments.push({x:cx,y:cy,got:false,ph:rand(0,TAU)}); }
    else if(c==='E'){ game.enemies.push({x:cx,y:cy,ox:cx,oy:cy,alive:true,ph:rand(0,TAU),jx:0,jy:0}); }
    else if(c==='G'){ game.goal={x:cx,y:cy,ph:0}; }
  }}
  game.fragTotal=game.fragments.length; game.fragGot=0; game.goalOpen=false;
  const p=game.p; p.x=game.spawn.x; p.y=game.spawn.y; p.ang=game.spawn.ang;
  p.light=100; p.pulseCd=0; p.pulseT=0; p.hurtT=0; p.dead=false; p.bob=0;
  game.time=0; game.constAnim=0; game.shake=0; fx.length=0;
  game.zbuf=new Float32Array(numRays);
}

/* ---------------------------------------------------------------- Helpers */
function isWall(x,y){ const mx=Math.floor(x),my=Math.floor(y);
  if(mx<0||my<0||mx>=game.gw||my>=game.gh) return true; return game.grid[my][mx]===1; }
function canStand(x,y){ const r=0.24;
  return !isWall(x-r,y-r)&&!isWall(x+r,y-r)&&!isWall(x-r,y+r)&&!isWall(x+r,y+r); }
function lightRange(){ const L=game.L,p=game.p;
  return (L.lightBase + p.light/100*3.2) * (p.pulseT>0? 2.6:1); }

function tryPulse(){ const p=game.p;
  if(p.pulseCd>0||p.light<10||p.dead) return;
  p.pulseT=0.5; p.pulseCd=1.2; p.light=Math.max(0,p.light-8); Audio.S.pulse();
  fxBurst(W/2,H/2,26,game.L.accent);
  for(const e of game.enemies){ if(!e.alive) continue;
    const d=Math.hypot(e.x-p.x,e.y-p.y); if(d<3.2){ e.alive=false; Audio.S.shadow(); } } }

/* ------------------------------------------------------------- Update play */
function updatePlay(dt){
  const L=game.L, p=game.p; game.time+=dt;
  // ---- rotação ----
  let turn=0;
  if(keys['a']||keys['arrowleft']) turn-=1;
  if(keys['d']||keys['arrowright']) turn+=1;
  p.ang += turn*2.4*dt;
  p.ang += mouse.dx*0.0022; mouse.dx=0;
  if(p.ang>Math.PI) p.ang-=TAU; if(p.ang<-Math.PI) p.ang+=TAU;
  // ---- movimento ----
  let fwd=0, strafe=0;
  if(keys['w']||keys['arrowup']) fwd+=1;
  if(keys['s']||keys['arrowdown']) fwd-=1;
  if(keys['q']) strafe-=1;
  if(keys['e']) strafe+=1;
  if(tch.active) fwd+=1; // toque = andar pra frente
  const spd=2.7*dt;
  const dx=Math.cos(p.ang), dy=Math.sin(p.ang);
  let nx=p.x + (dx*fwd - dy*strafe)*spd;
  let ny=p.y + (dy*fwd + dx*strafe)*spd;
  if(canStand(nx,p.y)) p.x=nx;
  if(canStand(p.x,ny)) p.y=ny;
  if(fwd!==0||strafe!==0){ game.walkT+=dt*9; p.bob=Math.sin(game.walkT)*2.2;
    if(Math.sin(game.walkT)>0.98) Audio.S.step(); } else { p.bob*=(1-6*dt); }
  // ---- pulso ----
  p.pulseCd=Math.max(0,p.pulseCd-dt); p.pulseT=Math.max(0,p.pulseT-dt);
  if(consume(' ')||consume('shift')||consume('j')||consume('k')) tryPulse();
  // ---- fragmentos ----
  for(const f of game.fragments){ if(f.got) continue; f.ph+=dt*3;
    if(Math.hypot(f.x-p.x,f.y-p.y)<0.55){ f.got=true; game.fragGot++;
      p.light=Math.min(p.maxLight,p.light+14); Audio.S.collect(); fxBurst(W/2,H*0.55,18,'#ffe98a');
      if(game.fragGot>=game.fragTotal && !game.goalOpen){ game.goalOpen=true; Audio.S.open(); fxBurst(W/2,H/2,40,L.accent); } } }
  // ---- inimigos ----
  for(const e of game.enemies){ if(!e.alive) continue; e.ph+=dt*2;
    const ex=p.x-e.x, ey=p.y-e.y; const d=Math.hypot(ex,ey)||1;
    if(d<7){ // caça
      e.jx=lerp(e.jx, rand(-0.4,0.4), dt); e.jy=lerp(e.jy, rand(-0.4,0.4), dt);
      const sp=1.55*dt; const mvx=(ex/d+e.jx)*sp, mvy=(ey/d+e.jy)*sp;
      if(canStand(e.x+mvx,e.y)) e.x+=mvx; if(canStand(e.x,e.y+mvy)) e.y+=mvy;
    } else { e.x=e.ox+Math.sin(e.ph)*0.4; e.y=e.oy+Math.cos(e.ph*0.8)*0.4; }
    if(d<0.55 && p.hurtT<=0){ damage(22); const k=0.35; // empurrão
      if(canStand(p.x-ex/d*k,p.y)) p.x-=ex/d*k; if(canStand(p.x,p.y-ey/d*k)) p.y-=ey/d*k; } }
  // ---- farol / objetivo ----
  if(game.goalOpen){ game.goal.ph+=dt*3;
    if(Math.hypot(game.goal.x-p.x,game.goal.y-p.y)<0.7) completeLevel(); }
  // ---- estado ----
  p.hurtT=Math.max(0,p.hurtT-dt);
  if(p.light<=0 && !p.dead){ p.dead=true; fxBurst(W/2,H/2,40,'#88f'); setTimeout(respawn,700); }
  if(game.shake>0) game.shake=Math.max(0,game.shake-dt*4);
}
function damage(a){ const p=game.p; if(p.hurtT>0||p.dead) return;
  p.light=Math.max(0,p.light-a); p.hurtT=1.0; game.shake=1.0; Audio.S.hurt(); fxBurst(W/2,H/2,16,'#ff6b6b'); }
function respawn(){ const p=game.p,s=game.spawn; p.x=s.x; p.y=s.y; p.ang=s.ang;
  p.light=Math.max(55,p.light); p.dead=false; p.hurtT=0.8; fxBurst(W/2,H/2,24,game.L.accent); }
function completeLevel(){ Audio.S.goal(); state=GS.LEVEL_DONE; game.constAnim=0; fxBurst(W/2,H/2,60,'#fff'); }

/* ============================================================ RAYCASTER */
function shadeColor(rgb, b){ b=clamp(b,0,1);
  return `rgb(${Math.round(rgb[0]*b)},${Math.round(rgb[1]*b)},${Math.round(rgb[2]*b)})`; }

function renderWorld(){
  const L=game.L, p=game.p;
  const horizon = H*0.5 - p.bob;
  // ---- teto ----
  let g=ctx.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,L.ceil[0]); g.addColorStop(1,L.ceil[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,horizon+1);
  // ---- chão ----
  g=ctx.createLinearGradient(0,horizon,0,H);
  g.addColorStop(0,L.floor[0]); g.addColorStop(1,L.floor[1]);
  ctx.fillStyle=g; ctx.fillRect(0,horizon,W,H-horizon);
  // poça de luz no chão perto dos "pés"
  const lr=lightRange();
  g=ctx.createRadialGradient(W/2,H*0.92,10,W/2,H*0.92,H*0.6);
  g.addColorStop(0, hexA(L.accent,0.16*clamp(lr/6,0,1)));
  g.addColorStop(1, hexA(L.accent,0));
  ctx.fillStyle=g; ctx.fillRect(0,horizon,W,H-horizon);

  // ---- paredes (DDA) ----
  const dirX=Math.cos(p.ang), dirY=Math.sin(p.ang);
  const planeLen=0.66; const planeX=-dirY*planeLen, planeY=dirX*planeLen;
  const zbuf=game.zbuf;
  for(let r=0;r<numRays;r++){
    const cameraX=2*r/numRays-1;
    const rdx=dirX+planeX*cameraX, rdy=dirY+planeY*cameraX;
    let mapX=Math.floor(p.x), mapY=Math.floor(p.y);
    const ddx=Math.abs(rdx)<1e-6?1e6:Math.abs(1/rdx);
    const ddy=Math.abs(rdy)<1e-6?1e6:Math.abs(1/rdy);
    let stepX,stepY,sdX,sdY;
    if(rdx<0){ stepX=-1; sdX=(p.x-mapX)*ddx; } else { stepX=1; sdX=(mapX+1-p.x)*ddx; }
    if(rdy<0){ stepY=-1; sdY=(p.y-mapY)*ddy; } else { stepY=1; sdY=(mapY+1-p.y)*ddy; }
    let side=0, hit=false, guard=0;
    while(!hit && guard++<64){
      if(sdX<sdY){ sdX+=ddx; mapX+=stepX; side=0; } else { sdY+=ddy; mapY+=stepY; side=1; }
      if(mapX<0||mapY<0||mapX>=game.gw||mapY>=game.gh){ hit=true; break; }
      if(game.grid[mapY][mapX]===1) hit=true;
    }
    let perp = side===0 ? (sdX-ddx) : (sdY-ddy);
    if(perp<0.02) perp=0.02;
    zbuf[r]=perp;
    const lh=Math.min(H*4, H/perp);
    let y0=horizon-lh/2, y1=horizon+lh/2;
    // brilho baseado em distância (a luz só alcança até certo ponto)
    let b=1 - perp/lr; b=clamp(b,0,1); b=Math.pow(b,1.4);
    b = 0.03 + 0.97*b; // ambiente mínimo
    if(side===1) b*=0.68;
    const base = side===0? L.wall : L.wall2;
    ctx.fillStyle=shadeColor(base,b);
    ctx.fillRect(r*COLW, y0, COLW+1, y1-y0);
    // aresta superior sutil (highlight de topo)
    if(b>0.25){ ctx.fillStyle=shadeColor([255,255,255], b*0.10); ctx.fillRect(r*COLW,y0,COLW+1,Math.max(1,lh*0.02)); }
  }

  // ---- sprites (billboards) ----
  const sprites=[];
  for(const f of game.fragments){ if(!f.got) sprites.push({x:f.x,y:f.y,type:'frag',o:f}); }
  for(const e of game.enemies){ if(e.alive) sprites.push({x:e.x,y:e.y,type:'enemy',o:e}); }
  if(game.goal) sprites.push({x:game.goal.x,y:game.goal.y,type:'goal',o:game.goal});
  const invDet=1/(planeX*dirY - dirX*planeY);
  for(const s of sprites){ s.dist=(s.x-p.x)**2+(s.y-p.y)**2; }
  sprites.sort((a,b)=>b.dist-a.dist);
  for(const s of sprites){
    const rx=s.x-p.x, ry=s.y-p.y;
    const tx=invDet*(dirY*rx - dirX*ry);
    const ty=invDet*(-planeY*rx + planeX*ry); // profundidade
    if(ty<=0.15) continue;
    const screenX=(numRays/2)*(1+tx/ty)*COLW;
    const col=Math.floor(screenX/COLW);
    if(col<0||col>=numRays) continue;
    if(ty > zbuf[col]+0.2) continue; // atrás da parede
    const size=Math.min(H*1.5, (H/ty));
    drawSprite(s, screenX, horizon, size, ty, lr);
  }

  // ---- flash do pulso ----
  if(p.pulseT>0){ ctx.save(); const a=clamp(p.pulseT/0.5,0,1);
    const rg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*0.7);
    rg.addColorStop(0,hexA(L.accent,0.35*a)); rg.addColorStop(0.6,hexA(L.accent,0.12*a)); rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg; ctx.fillRect(0,0,W,H); ctx.restore(); }

  // ---- vinheta de escuridão ----
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,`rgba(0,0,4,${0.55+L.darkness*0.35})`);
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // dano na tela
  if(p.hurtT>0){ ctx.fillStyle=`rgba(140,10,20,${0.28*clamp(p.hurtT,0,1)})`; ctx.fillRect(0,0,W,H); }
}

function drawSprite(s, sx, horizon, size, depth, lr){
  const L=game.L;
  if(s.type==='goal'){
    const open=game.goalOpen;
    const w=Math.max(6,size*0.32);
    const lh=Math.min(H*4,H/depth);
    const top=horizon-lh*0.55, bot=horizon+lh*0.55;
    ctx.save();
    const g=ctx.createLinearGradient(sx,top,sx,bot);
    const c= open? '#fff6cf' : L.accent;
    g.addColorStop(0,hexA(c,0)); g.addColorStop(0.5,hexA(c,open?0.95:0.5)); g.addColorStop(1,hexA(c,0));
    ctx.fillStyle=g; ctx.shadowColor=c; ctx.shadowBlur=open?40:14;
    ctx.fillRect(sx-w/2, top, w, bot-top);
    // núcleo estrela
    ctx.shadowBlur=open?30:10; ctx.fillStyle=open?'#fffef0':hexA(c,0.6);
    star(sx,horizon,size*0.05,size*0.14,5,s.o.ph||0); ctx.fill();
    ctx.restore();
    return;
  }
  if(s.type==='frag'){
    const b=clamp(1.3 - depth/(lr*1.7),0.25,1);
    const rad=Math.max(3,size*0.10);
    ctx.save();
    const g=ctx.createRadialGradient(sx,horizon,0,sx,horizon,rad*3);
    g.addColorStop(0,`rgba(255,246,207,${0.9*b})`); g.addColorStop(0.4,`rgba(255,220,120,${0.4*b})`); g.addColorStop(1,'rgba(255,220,120,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(sx,horizon,rad*3,0,TAU); ctx.fill();
    ctx.shadowColor='#ffe98a'; ctx.shadowBlur=18*b; ctx.fillStyle=`rgba(255,250,220,${b})`;
    star(sx,horizon+Math.sin(s.o.ph)*rad*0.3, rad*0.5, rad, 5, s.o.ph*0.6); ctx.fill();
    ctx.restore();
    return;
  }
  if(s.type==='enemy'){
    const b=clamp(1 - depth/(lr*1.1),0.05,1);
    const rad=Math.max(4,size*0.13);
    const e=s.o;
    ctx.save();
    // corpo (nuvem escura ondulante)
    ctx.shadowColor='#6a3bd0'; ctx.shadowBlur=16*b+4;
    ctx.fillStyle=shadeColor([26,10,46], 0.4+0.6*b);
    ctx.beginPath();
    for(let a=0;a<TAU;a+=0.4){ const rr=rad*(1+0.18*Math.sin(a*3+e.ph*2));
      const px=sx+Math.cos(a)*rr, py=horizon+Math.sin(a)*rr;
      if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py); }
    ctx.closePath(); ctx.fill();
    // olhos brilhantes (sempre visíveis)
    ctx.shadowColor='#c79bff'; ctx.shadowBlur=10; ctx.fillStyle='#d8b8ff';
    const ey=rad*0.34;
    ctx.beginPath(); ctx.arc(sx-rad*0.34,horizon-ey,rad*0.16,0,TAU); ctx.arc(sx+rad*0.34,horizon-ey,rad*0.16,0,TAU); ctx.fill();
    ctx.restore();
    return;
  }
}

function star(cx,cy,rIn,rOut,pts,rot){ ctx.beginPath();
  for(let i=0;i<pts*2;i++){ const r=i%2?rIn:rOut; const a=(i/(pts*2))*TAU+(rot||0);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }
  ctx.closePath(); }
function hexA(hex,a){ const h=hex.replace('#','');
  return `rgba(${parseInt(h.substr(0,2),16)},${parseInt(h.substr(2,2),16)},${parseInt(h.substr(4,2),16)},${a})`; }

/* --------------------------------------------------------------- Minimap */
function drawMinimap(){
  const big = keys['tab'];
  const cell = big? 14 : 7;
  const mw=game.gw*cell, mh=game.gh*cell;
  const ox=W-mw-16, oy=16;
  ctx.save();
  ctx.globalAlpha=big?0.92:0.7;
  ctx.fillStyle='rgba(3,4,12,0.7)'; ctx.fillRect(ox-4,oy-4,mw+8,mh+8);
  for(let y=0;y<game.gh;y++){ for(let x=0;x<game.gw;x++){
    if(game.grid[y][x]===1){ ctx.fillStyle=hexA(game.L.accent,0.35); ctx.fillRect(ox+x*cell,oy+y*cell,cell-1,cell-1); } } }
  // fragmentos
  for(const f of game.fragments){ if(f.got) continue; ctx.fillStyle='#ffe98a';
    ctx.fillRect(ox+f.x*cell-1.5,oy+f.y*cell-1.5,3,3); }
  // farol
  if(game.goal){ ctx.fillStyle=game.goalOpen?'#8fffd0':'#4a7'; const gx=ox+game.goal.x*cell, gy=oy+game.goal.y*cell;
    ctx.beginPath(); ctx.arc(gx,gy,3,0,TAU); ctx.fill(); }
  // inimigos (só se visíveis/perto)
  if(big){ for(const e of game.enemies){ if(!e.alive) continue; ctx.fillStyle='#c79bff';
    ctx.fillRect(ox+e.x*cell-1.5,oy+e.y*cell-1.5,3,3); } }
  // jogador
  const p=game.p; const px=ox+p.x*cell, py=oy+p.y*cell;
  ctx.fillStyle='#fffef0'; ctx.beginPath(); ctx.arc(px,py,cell*0.35,0,TAU); ctx.fill();
  ctx.strokeStyle='#fffef0'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(px,py);
  ctx.lineTo(px+Math.cos(p.ang)*cell*1.4, py+Math.sin(p.ang)*cell*1.4); ctx.stroke();
  ctx.restore(); ctx.globalAlpha=1;
  if(!big){ ctx.fillStyle='rgba(150,170,200,0.5)'; ctx.font='10px Trebuchet MS'; ctx.textAlign='right';
    ctx.fillText('TAB: mapa', W-16, oy+mh+14); ctx.textAlign='left'; }
}

/* ------------------------------------------------------------------ HUD */
function drawHUD(){
  const p=game.p, L=game.L;
  // barra de luz
  const bw=220,bh=16,bx=20,by=20;
  ctx.fillStyle='rgba(0,0,0,0.4)'; rr(bx-4,by-4,bw+8,bh+8,8); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.12)'; rr(bx,by,bw,bh,6); ctx.fill();
  const g=ctx.createLinearGradient(bx,0,bx+bw,0); g.addColorStop(0,'#ffd27a'); g.addColorStop(1,'#fff6cf');
  ctx.fillStyle=g; ctx.shadowColor='#ffe98a'; ctx.shadowBlur=12; rr(bx,by,Math.max(0,bw*p.light/p.maxLight),bh,6); ctx.fill();
  ctx.shadowBlur=0; ctx.fillStyle='#cfe'; ctx.font='12px Trebuchet MS'; ctx.fillText('LUZ',bx,by+bh+16);
  // pulso
  ctx.fillStyle=p.pulseCd<=0?'#8fffd0':'#667'; ctx.font='12px Trebuchet MS';
  ctx.fillText(p.pulseCd<=0?'◎ PULSO pronto (Espaço/Shift)':`◎ Pulso… ${p.pulseCd.toFixed(1)}s`, bx, by+bh+34);
  // fragmentos
  ctx.save(); ctx.textAlign='center';
  ctx.font='bold 16px Trebuchet MS'; ctx.fillStyle='#fff6cf';
  ctx.fillText(`✦ ${game.fragGot} / ${game.fragTotal}`, W/2, 30);
  ctx.font='12px Trebuchet MS'; ctx.fillStyle=game.goalOpen?'#8fffd0':'#9ab';
  ctx.fillText(game.goalOpen?'Farol aberto — siga o feixe de luz!':'Reúna os fragmentos de estrela', W/2, 50);
  ctx.globalAlpha=0.55; ctx.fillStyle='#89a'; ctx.font='11px Trebuchet MS';
  ctx.fillText(`Capítulo ${game.levelIndex+1}/5 · ${L.name}`, W/2, H-28);
  ctx.fillText('W/↑ andar · A D girar · Q E lado · Espaço/Shift pulso · ESC pausar · clique: mouse-look', W/2, H-12);
  ctx.restore(); ctx.textAlign='left';
  // mira
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(W/2,H/2,4,0,TAU); ctx.stroke();
  drawMinimap();
}
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

/* ------------------------------------------------------------ Screens */
let titleT=0, titleStars=null;
function starfield(){ const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05060f'); g.addColorStop(0.6,'#0a1226'); g.addColorStop(1,'#0f1c3a');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  if(!titleStars){ titleStars=[]; for(let i=0;i<200;i++) titleStars.push({x:Math.random(),y:Math.random(),r:rand(0.5,2),ph:rand(0,TAU),z:rand(0.2,1)}); }
  for(const s of titleStars){ const tw=0.4+0.6*(0.5+0.5*Math.sin(titleT*2+s.ph));
    ctx.globalAlpha=tw*s.z; ctx.fillStyle='#dfe8ff'; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,Math.max(0.1,s.r*tw),0,TAU); ctx.fill(); }
  ctx.globalAlpha=1; }
function floatingOrb(y){ const ox=W/2, oy=y+Math.sin(titleT)*10;

  ctx.fillStyle=ag; ctx.beginPath(); ctx.arc(ox,oy,60,0,TAU); ctx.fill();
  ctx.shadowColor='#fff'; ctx.shadowBlur=24; ctx.fillStyle='#fffef0'; ctx.beginPath(); ctx.arc(ox,oy,10,0,TAU); ctx.fill(); ctx.shadowBlur=0; }

function drawLevelDone(){
  ctx.fillStyle='#04050c'; ctx.fillRect(0,0,W,H); starfield();
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,W,H);
  const L=game.L, con=CONSTS[game.levelIndex]; game.constAnim+=1/60; const t=game.constAnim;
  const cx=W/2, cy=H*0.45, scale=Math.min(W,H)*0.3;
  ctx.save();
  const edgeProg=clamp((t-0.6)/1.8,0,1); const ne=con.edges.length;
  ctx.strokeStyle=hexA(L.accent,0.7); ctx.lineWidth=2; ctx.shadowColor=L.accent; ctx.shadowBlur=10;
  for(let i=0;i<ne;i++){ const seg=edgeProg*ne-i; if(seg<=0) continue; const f=clamp(seg,0,1);
    const [a,b]=con.edges[i]; const pa=con.pts[a],pb=con.pts[b];
    const x1=cx+(pa[0]-0.5)*scale*2,y1=cy+(pa[1]-0.5)*scale*2, x2=cx+(pb[0]-0.5)*scale*2,y2=cy+(pb[1]-0.5)*scale*2;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(lerp(x1,x2,f),lerp(y1,y2,f)); ctx.stroke(); }
  for(let i=0;i<con.pts.length;i++){ const pp=con.pts[i];
    const x=cx+(pp[0]-0.5)*scale*2,y=cy+(pp[1]-0.5)*scale*2; const ap=clamp(t-i*0.08,0,1); if(ap<=0) continue;
    ctx.globalAlpha=ap; ctx.shadowColor='#fff'; ctx.shadowBlur=16; ctx.fillStyle='#fff6cf';
    star(x,y,2,6+2*Math.sin(t*3+i),5,t); ctx.fill(); }
  ctx.restore(); ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.textAlign='center'; ctx.fillStyle='#89a'; ctx.font='15px Trebuchet MS'; ctx.fillText('CONSTELAÇÃO REACESA', W/2, cy-scale-30);
  ctx.shadowColor=L.accent; ctx.shadowBlur=14; ctx.fillStyle='#fff'; ctx.font='bold 34px Trebuchet MS'; ctx.fillText(con.name, W/2, cy-scale); ctx.shadowBlur=0;
  if(t>2.4){ const a=0.4+0.6*Math.sin(titleT*3); ctx.globalAlpha=a; ctx.fillStyle='#8fb'; ctx.font='18px Trebuchet MS';
    ctx.fillText(game.levelIndex>=LEVELS.length-1?'▶ ENTER / clique para o amanhecer':'▶ ENTER / clique para o próximo capítulo', W/2, H*0.82); ctx.globalAlpha=1; }
  ctx.textAlign='left'; }

function drawPause(){ renderWorld(); drawHUD();
  ctx.fillStyle='rgba(0,0,10,0.65)'; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 48px Trebuchet MS'; ctx.fillText('Pausado', W/2, H*0.42);
  ctx.fillStyle='#9cf'; ctx.font='18px Trebuchet MS'; ctx.fillText('ENTER: continuar   ·   R: reiniciar capítulo   ·   M: som', W/2, H*0.52);
  ctx.fillStyle='#678'; ctx.font='14px Trebuchet MS'; ctx.fillText(Audio.isMuted()?'som: desligado':'som: ligado', W/2, H*0.6);
  ctx.restore(); ctx.textAlign='left'; }

/* --------------------------------------------------------- Transitions */
function startTrans(cb){ game.transDir=1; game.transCb=cb; }
function updateTrans(dt){ if(game.transDir===1){ game.trans+=dt*2.2;
    if(game.trans>=1){ game.trans=1; if(game.transCb){game.transCb();game.transCb=null;} game.transDir=-1; } }
  else if(game.transDir===-1){ game.trans-=dt*2.2; if(game.trans<=0){ game.trans=0; game.transDir=0; } } }
function drawTrans(){ if(game.trans<=0) return; ctx.fillStyle=`rgba(0,0,4,${game.trans})`; ctx.fillRect(0,0,W,H); }

/* ------------------------------------------------------- Flow control */
function goToLevel(i){ startTrans(()=>{ parseLevel(i); state=GS.LEVEL_INTRO; levelIntroT=0; }); }
function startGame(){ Audio.resume(); Audio.startDrone(); storyList=STORY_INTRO; storyPage=0; state=GS.INTRO; }
function nextAfterStory(){ if(storyList===STORY_INTRO){ goToLevel(0); }
  else if(storyList===STORY_OUTRO){ startTrans(()=>{ state=GS.TITLE; }); } }

function handleInput(){
  if(consume('m')){ const m=Audio.toggleMute(); if(!m) Audio.startDrone(); Audio.S.ui(); }
  if(state===GS.TITLE){ if(confirmPressed()){ Audio.S.ui(); startGame(); } }
  else if(state===GS.INTRO||state===GS.OUTRO){ if(confirmPressed()){ Audio.S.ui();
      if(storyPage<storyList.length-1) storyPage++; else nextAfterStory(); } }
  else if(state===GS.LEVEL_INTRO){ if(confirmPressed() && levelIntroT>0.4){ Audio.S.ui(); state=GS.PLAY; } }
  else if(state===GS.PLAY){ if(consume('escape')||consume('p')){ state=GS.PAUSE; if(mouse.locked) document.exitPointerLock(); } }
  else if(state===GS.PAUSE){ if(consume('escape')||consume('enter')||consume('p')){ state=GS.PLAY; }
      if(consume('r')){ startTrans(()=>{ parseLevel(game.levelIndex); state=GS.PLAY; }); } }
  else if(state===GS.LEVEL_DONE){ if(game.constAnim>2.4 && confirmPressed()){ Audio.S.ui();
      if(game.levelIndex>=LEVELS.length-1){ startTrans(()=>{ storyList=STORY_OUTRO; storyPage=0; state=GS.OUTRO; Audio.S.win(); }); }
      else goToLevel(game.levelIndex+1); } }
}

/* ------------------------------------------------------------ Main loop */
let last=now();
function frame(){
  const t=now(); let dt=t-last; last=t; dt=Math.min(dt,1/30);
  titleT+=dt; levelIntroT+=dt;
  updateTrans(dt);
  const blocking = game.transDir!==0 && game.trans>0.5;
  if(state===GS.PLAY && !blocking) updatePlay(dt);
  fxUpdate(dt);
  handleInput();

  ctx.setTransform(DPR,0,0,DPR,0,0);
  let shx=0,shy=0; if(state===GS.PLAY && game.shake>0){ shx=rand(-1,1)*game.shake*6; shy=rand(-1,1)*game.shake*6; }
  ctx.save(); ctx.translate(shx,shy);
  switch(state){
    case GS.TITLE: drawTitle(); break;
    case GS.INTRO: case GS.OUTRO: drawStory(); break;
    case GS.LEVEL_INTRO: drawLevelIntro(); break;
    case GS.PLAY: renderWorld(); fxDraw(); drawHUD(); break;
    case GS.PAUSE: drawPause(); break;
    case GS.LEVEL_DONE: drawLevelDone(); fxDraw(); break;
  }
  ctx.restore();
  drawTrans();
  mouse.clicked=false;
  requestAnimationFrame(frame);
}

/* --------------------------------------------------------------- Boot */
window.addEventListener('resize', resize);
resize();
parseLevel(0); // pré-carrega para dimensionar buffers
state=GS.TITLE;
document.getElementById('loading').style.display='none';
requestAnimationFrame(frame);
</script>
</body>
