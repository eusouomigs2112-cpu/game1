<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Esquiva Neon · PC</title>
<style>
  :root { --accent:#00e5ff; --accent2:#ff2bd6; --bg:#05030f; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; overflow:hidden; background:var(--bg); font-family:"Segoe UI",system-ui,sans-serif; color:#eaf6ff; touch-action:none; }
  #game { position:fixed; inset:0; display:block; }

  #hud { position:fixed; inset:0; pointer-events:none; z-index:5; }
  #topbar {
    position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    display:flex; gap:16px; align-items:center;
    background:rgba(8,6,22,.62); padding:8px 16px; border-radius:26px;
    border:1px solid rgba(0,229,255,.35); backdrop-filter:blur(6px);
    font-size:14px; white-space:nowrap;
  }
  #topbar b { color:var(--accent); font-variant-numeric:tabular-nums; }
  .combo { color:var(--accent2)!important; }
  #shiptag {
    position:absolute; top:calc(58px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-size:12px; letter-spacing:1.5px; opacity:.85; white-space:nowrap; text-align:center;
    text-shadow:0 1px 6px #000;
  }
  #shiptag b { color:var(--accent); }
  #shipbar { width:130px; height:4px; margin:5px auto 0; background:rgba(255,255,255,.14); border-radius:3px; overflow:hidden; }
  #shipbar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .2s; }

  #mute {
    position:absolute; top:calc(10px + env(safe-area-inset-top)); right:12px;
    pointer-events:auto; z-index:9; background:rgba(8,6,22,.6);
    border:1px solid rgba(0,229,255,.35); color:#eaf6ff; font-size:20px;
    width:44px; height:44px; border-radius:14px; backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  #back {
    position:absolute; top:calc(10px + env(safe-area-inset-top)); left:12px;
    pointer-events:auto; z-index:9; background:rgba(8,6,22,.6);
    border:1px solid rgba(0,229,255,.35); color:#eaf6ff; font-size:20px;
    width:44px; height:44px; border-radius:14px; backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; text-decoration:none; cursor:pointer;
  }
  .screen {
    position:fixed; inset:0; z-index:8; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:24px;
    background:radial-gradient(ellipse at center, rgba(10,6,26,.72), rgba(3,2,10,.94));
    backdrop-filter:blur(3px);
  }
  .screen.hidden { display:none; }
  .title {
    font-size:clamp(40px,15vw,78px); font-weight:900; letter-spacing:3px; line-height:.95;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:8px;
  }
  .sub { opacity:.85; font-size:15px; max-width:340px; margin-bottom:26px; line-height:1.5; }
  .btn {
    pointer-events:auto; cursor:pointer; border:none; font-weight:800; letter-spacing:1px;
    font-size:22px; padding:18px 52px; border-radius:44px; color:#04121a;
    background:linear-gradient(90deg,var(--accent),#7cf7ff);
    box-shadow:0 0 28px rgba(0,229,255,.5); -webkit-tap-highlight-color:transparent;
  }
  .btn:active { transform:scale(.97); }
  .hint { margin-top:22px; font-size:13px; opacity:.6; max-width:340px; line-height:1.7; }
  #finalScore { font-size:20px; margin-bottom:8px; }
  #finalScore b { color:var(--accent); font-size:30px; }
  #best { opacity:.7; font-size:15px; margin-bottom:24px; }
  #newRecord { color:var(--accent2); font-weight:800; letter-spacing:2px; margin-bottom:8px; display:none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<a href="index.html" id="back" title="Menu">‹</a>
<button id="mute" title="Som">🔊</button>

<div id="hud">
  <div id="topbar">
    <span>Pts <b id="score">0</b></span>
    <span id="comboBox" style="display:none">Combo <b class="combo" id="combo">x1</b></span>
    <span>Fase <b id="phase">1</b></span>
    <span id="lives">❤❤❤</span>
  </div>
  <div id="shiptag"><span id="shipline">🚀 <b>EXPLORADOR</b></span><div id="shipbar"><i id="shipfill"></i></div></div>
</div>

<div class="screen" id="start">
  <div class="title">ESQUIVA<br>NEON</div>
  <div class="sub">Mova com o <b>mouse</b> e atire com <b>clique</b>/<b>espaço</b> (ou <b>setas</b>/<b>WASD</b>). Destrua asteroides pra <b>evoluir a nave</b> (20 naves!) e viajar por <b>20 fases</b>!</div>
  <button class="btn" id="playBtn">JOGAR</button>
  <div class="hint">🟢 vida · 🔵 escudo · 🩷 tiro triplo · 🟡 câmera lenta</div>
</div>

<div class="screen hidden" id="over">
  <div id="newRecord">✦ NOVO RECORDE ✦</div>
  <div class="title" style="font-size:clamp(30px,10vw,56px)">FIM DE JOGO</div>
  <div id="finalScore">Você fez <b>0</b> pontos</div>
  <div id="best">Recorde: 0</div>
  <button class="btn" id="againBtn">DE NOVO</button>
</div>

<script>
(() => {
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W=0,H=0,DPR=1;
  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=W*DPR; canvas.height=H*DPR;
    canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize',resize); resize();

  const S={running:false,over:false,t:0,score:0,level:1,lives:3,combo:1,comboTimer:0,
    slowmo:0,shield:0,triple:0,spawnTimer:0,difficulty:0,shake:0,flashHit:0,
    kills:0,tier:0,toast:null,phase:0,banner:null};

  const KILLS_PER_PHASE=80;
  // ------- 20 Fases: cenario e inimigos mudam a cada ~80 asteroides -------
  // scene: 'space' | 'earth' | 'moon' | 'rings' | 'sun' | 'nebula' | 'belt' | 'deep'
  const PHASES=[
    { name:'GALÁXIA',               sky:['#0a0620','#03020a'], scene:'space',  planet:null },
    { name:'ÓRBITA DA TERRA',       sky:['#04061a','#010208'], scene:'earth',  planet:['#3aa0ff','#1560c0','#0a2f6b'], atmo:'120,180,255' },
    { name:'CINTURÃO DE ASTEROIDES',sky:['#1a0f06','#08040a'], scene:'belt',   planet:null },
    { name:'ÓRBITA DA LUA',         sky:['#0b0d16','#04050a'], scene:'moon',   planet:['#e8e8ee','#9a9aa6','#54545e'] },
    { name:'NEBULOSA CARMESIM',     sky:['#1a0614','#07010a'], scene:'nebula', neb:['rgba(255,43,120,0.10)','rgba(255,120,60,0.09)','rgba(200,40,180,0.11)'] },
    { name:'ANÉIS DE SATURNO',      sky:['#1a1206','#08050a'], scene:'rings',  planet:['#f0d9a0','#caa35a','#8a6a2e'], atmo:'240,210,150' },
    { name:'CHUVA DE COMETAS',      sky:['#061420','#01060a'], scene:'nebula', neb:['rgba(0,229,255,0.10)','rgba(120,200,255,0.10)','rgba(80,255,220,0.09)'] },
    { name:'CAMPO MINADO ORBITAL',  sky:['#141406','#07070a'], scene:'belt',   planet:null },
    { name:'TEMPESTADE SOLAR',      sky:['#22120a','#0a0402'], scene:'sun',    planet:null },
    { name:'SETOR DE JÚPITER',      sky:['#1a1008','#08050a'], scene:'rings',  planet:['#e8c39a','#c98b5a','#7a4f2e'], atmo:'230,180,140' },
    { name:'ZONA DE SUCATA',        sky:['#0e1214','#040608'], scene:'belt',   planet:null },
    { name:'NÉVOA DE ÍONS',         sky:['#06141a','#01080c'], scene:'nebula', neb:['rgba(0,255,200,0.10)','rgba(0,180,255,0.10)','rgba(120,255,180,0.08)'] },
    { name:'CINTURÃO DE KUIPER',    sky:['#0a0e18','#03040a'], scene:'deep',   planet:null },
    { name:'ESTAÇÃO ABANDONADA',    sky:['#12101a','#05040a'], scene:'space',  planet:null },
    { name:'NEBULOSA AZUL',         sky:['#060e22','#01040e'], scene:'nebula', neb:['rgba(60,120,255,0.11)','rgba(0,200,255,0.10)','rgba(120,80,255,0.10)'] },
    { name:'ENXAME ALIENÍGENA',     sky:['#0a1a0e','#03080a'], scene:'space',  planet:null },
    { name:'BURACO NEGRO',          sky:['#0a0612','#010008'], scene:'sun',    planet:null, dark:true },
    { name:'BORDA DA VIA LÁCTEA',   sky:['#120a1e','#04020c'], scene:'nebula', neb:['rgba(180,120,255,0.11)','rgba(255,80,200,0.09)','rgba(80,140,255,0.10)'] },
    { name:'VAZIO CÓSMICO',         sky:['#050508','#010102'], scene:'deep',   planet:null },
    { name:'NÚCLEO GALÁCTICO',      sky:['#1e0a06','#0a0202'], scene:'sun',    planet:null },
  ];
  function enemyWeights(ph){
    const rock=Math.max(0.22, 1 - ph*0.05);
    const sat  = ph>=1 ? Math.min(0.42, 0.12 + ph*0.025) : 0;
    const comet= ph>=3 ? Math.min(0.30, (ph-2)*0.045) : 0;
    const ufo  = ph>=7 ? Math.min(0.28, (ph-6)*0.035) : 0;
    return [['rock',rock],['sat',sat],['comet',comet],['ufo',ufo]].filter(e=>e[1]>0);
  }
  let sceneData={neb:[],belt:[],craters:[]};
  function initScene(){
    const p=PHASES[S.phase];
    sceneData={neb:[],belt:[],craters:[]};
    if(p.scene==='nebula'){ const cols=p.neb||['rgba(150,80,255,0.11)']; for(let i=0;i<6;i++) sceneData.neb.push({x:rand(0,W),y:rand(0,H),r:rand(W*.35,W*.7),c:cols[i%cols.length]}); }
    if(p.scene==='belt'){ for(let i=0;i<26;i++) sceneData.belt.push({x:rand(0,W),y:rand(0,H),r:rand(3,10),sp:rand(.2,.6)}); }
    if(p.scene==='moon'){ for(let i=0;i<8;i++) sceneData.craters.push({fx:rand(.08,.92),fy:rand(0,.2),r:rand(.02,.05)}); }
  }
  function checkPhase(){
    const np=Math.min(PHASES.length-1, Math.floor(S.kills/KILLS_PER_PHASE));
    if(np>S.phase){ S.phase=np; phaseUp(); }
  }
  function phaseUp(){
    const p=PHASES[S.phase]; initScene();
    S.banner={l1:'FASE '+(S.phase+1)+' / '+PHASES.length, l2:p.name, timer:220};
    S.shake=Math.max(S.shake,14);
    beep(300,.2,'sawtooth',.08); setTimeout(()=>beep(500,.28,'triangle',.08),150);
    if(navigator.vibrate) navigator.vibrate([60,50,90]);
  }
  // fator extra de dificuldade por fase (soma ao tempo)
  function phaseDiff(){ return S.difficulty + S.phase*0.35; }

  // ------- Naves: sobem de tier a cada X asteroides destruidos -------
  // Cada tier muda o formato, a cor, o dano e a quantidade de tiros.
  const SHIP_SHAPES=[drawArrow,drawInterceptor,drawXwing,drawCruiser,drawDestroyer];
  const SHIP_NAMES=['EXPLORADOR','INTERCEPTOR','CAÇA-X','CRUZADOR','DESTROYER','FALCÃO','VÍPERA','FÊNIX',
    'TITÃ','CENTURIÃO','ESPECTRO','DRAGÃO','VALQUÍRIA','GÓRGONA','LEVIATÃ','NÊMESIS','HIDRA','RAGNAROK','ÔMEGA','ANIQUILADOR'];
  const SHIP_PALETTES=[
    {top:'#aef7ff',bot:'#00e5ff',glow:'#00e5ff',accent:'#ff4d4d'},
    {top:'#b9ffd8',bot:'#18e58a',glow:'#18e58a',accent:'#eaffef'},
    {top:'#e6efff',bot:'#7aa0ff',glow:'#7aa0ff',accent:'#ff4d4d'},
    {top:'#e0c9ff',bot:'#8a4dff',glow:'#a06bff',accent:'#ffd6ff'},
    {top:'#ffe6a0',bot:'#ff9e2b',glow:'#ffb347',accent:'#fff2cc'},
    {top:'#ffd0e8',bot:'#ff2bd6',glow:'#ff2bd6',accent:'#ffffff'},
    {top:'#d0fff0',bot:'#00ffc3',glow:'#00ffc3',accent:'#004433'},
    {top:'#fff0c0',bot:'#ffd23f',glow:'#ffd23f',accent:'#aa6600'},
    {top:'#ffc9c9',bot:'#ff4d4d',glow:'#ff5b5b',accent:'#ffffff'},
    {top:'#d9e0ff',bot:'#4d6bff',glow:'#4d6bff',accent:'#ffffff'},
  ];
  function shotsForTier(n){
    if(n<=1) return [0];
    const spread=0.1+n*0.025, arr=[];
    for(let j=0;j<n;j++) arr.push(-spread+(2*spread)*(j/(n-1)));
    return arr;
  }
  const SHIPS=(()=>{
    const out=[]; let k=0, inc=10;
    for(let i=0;i<20;i++){
      const shape=SHIP_SHAPES[i<5?i:2+(i%3)];
      const pal=SHIP_PALETTES[i%SHIP_PALETTES.length];
      const nShots=Math.min(7,1+Math.floor(i/3));
      out.push({ name:SHIP_NAMES[i], kills:k,
        cd:Math.max(5,12-i*0.4), dmg:1+Math.floor(i/4),
        shots:shotsForTier(nShots), top:pal.top,bot:pal.bot,glow:pal.glow,accent:pal.accent, draw:shape });
      k+=inc; inc+=5;
    }
    return out;
  })();
  function shipHull(c,r,ship){
    c.shadowColor=ship.glow; c.shadowBlur=18;
    const grad=c.createLinearGradient(0,-r*1.3,0,r*1.1);
    grad.addColorStop(0,ship.top); grad.addColorStop(1,ship.bot);
    c.fillStyle=grad; c.fill(); c.shadowBlur=0;
  }
  function drawArrow(c,r,ship){
    c.beginPath(); c.moveTo(0,-r); c.lineTo(r*.8,r*.9); c.lineTo(0,r*.4); c.lineTo(-r*.8,r*.9); c.closePath();
    shipHull(c,r,ship);
  }
  function drawInterceptor(c,r,ship){
    c.beginPath();
    c.moveTo(0,-r*1.15); c.lineTo(r*.34,-r*.1); c.lineTo(r*.98,r*.85); c.lineTo(r*.3,r*.55);
    c.lineTo(0,r*.85); c.lineTo(-r*.3,r*.55); c.lineTo(-r*.98,r*.85); c.lineTo(-r*.34,-r*.1); c.closePath();
    shipHull(c,r,ship);
    c.fillStyle=ship.accent; c.beginPath(); c.arc(0,-r*.15,r*.14,0,7); c.fill();
  }
  function drawXwing(c,r,ship){ // caça estilo Star Wars (X-wing) visto de cima
    c.lineWidth=3; c.strokeStyle=ship.bot; c.shadowColor=ship.glow; c.shadowBlur=10;
    for(const s of [-1,1]){
      c.beginPath(); c.moveTo(s*r*.2,-r*.15); c.lineTo(s*r*1.15,-r*.95); c.stroke();
      c.beginPath(); c.moveTo(s*r*.2, r*.2); c.lineTo(s*r*1.15, r*.95); c.stroke();
    }
    c.shadowBlur=0;
    for(const s of [-1,1]){ // pontas dos canhões (vermelho X-wing)
      c.fillStyle=ship.accent;
      c.beginPath(); c.arc(s*r*1.15,-r*.95,2.6,0,7); c.fill();
      c.beginPath(); c.arc(s*r*1.15, r*.95,2.6,0,7); c.fill();
    }
    c.beginPath(); // fuselagem
    c.moveTo(0,-r*1.25); c.lineTo(r*.22,-r*.4); c.lineTo(r*.22,r*.95); c.lineTo(0,r*1.1);
    c.lineTo(-r*.22,r*.95); c.lineTo(-r*.22,-r*.4); c.closePath();
    shipHull(c,r,ship);
    c.fillStyle='#0b1030'; c.beginPath(); c.arc(0,-r*.25,r*.15,0,7); c.fill(); // cabine
  }
  function drawCruiser(c,r,ship){
    c.beginPath();
    c.moveTo(0,-r*1.25); c.lineTo(r*.3,-r*.3); c.lineTo(r*1.2,r*.2); c.lineTo(r*1.2,r*.55);
    c.lineTo(r*.42,r*.5); c.lineTo(r*.5,r*1.05); c.lineTo(0,r*.8); c.lineTo(-r*.5,r*1.05);
    c.lineTo(-r*.42,r*.5); c.lineTo(-r*1.2,r*.55); c.lineTo(-r*1.2,r*.2); c.lineTo(-r*.3,-r*.3); c.closePath();
    shipHull(c,r,ship);
    c.fillStyle=ship.accent; c.beginPath(); c.arc(0,-r*.35,r*.16,0,7); c.fill();
  }
  function drawDestroyer(c,r,ship){ // cunha gigante estilo Star Destroyer
    c.beginPath();
    c.moveTo(0,-r*1.4); c.lineTo(r*1.3,r*1.05); c.lineTo(r*.4,r*.78); c.lineTo(0,r*1.1);
    c.lineTo(-r*.4,r*.78); c.lineTo(-r*1.3,r*1.05); c.closePath();
    shipHull(c,r,ship);
    c.strokeStyle=ship.accent; c.lineWidth=1.5; c.globalAlpha=.7;
    c.beginPath(); c.moveTo(0,-r*1.2); c.lineTo(0,r*.85); c.stroke();
    c.beginPath(); c.moveTo(-r*.5,r*.2); c.lineTo(r*.5,r*.2); c.stroke(); c.globalAlpha=1;
    c.fillStyle=ship.accent; c.beginPath(); c.arc(0,r*.4,r*.13,0,7); c.fill();
  }

  // ------- Desenho dos inimigos (ctx ja transladado pro centro do inimigo) -------
  function drawSat(rk){
    const r=rk.r;
    ctx.fillStyle='#26346b'; ctx.strokeStyle='#7aa0ff'; ctx.lineWidth=1.5;
    ctx.fillRect(-r*1.7,-r*.34,r*0.95,r*0.68); ctx.strokeRect(-r*1.7,-r*.34,r*0.95,r*0.68);
    ctx.fillRect(r*0.75,-r*.34,r*0.95,r*0.68); ctx.strokeRect(r*0.75,-r*.34,r*0.95,r*0.68);
    ctx.beginPath(); ctx.moveTo(-r*1.22,-r*.34); ctx.lineTo(-r*1.22,r*.34); ctx.moveTo(r*1.22,-r*.34); ctx.lineTo(r*1.22,r*.34); ctx.stroke();
    ctx.shadowColor='#aecbff'; ctx.shadowBlur=10; ctx.fillStyle='#c9d6f0';
    ctx.fillRect(-r*.55,-r*.55,r*1.1,r*1.1); ctx.shadowBlur=0;
    ctx.fillStyle=rk.hp>2?'#ff4d4d':'#ffd23f'; ctx.beginPath(); ctx.arc(0,-r*.05,r*.26,0,7); ctx.fill();
  }
  function drawComet(rk){
    const r=rk.r;
    const g=ctx.createLinearGradient(0,-r*3.4,0,0);
    g.addColorStop(0,'rgba(0,229,255,0)'); g.addColorStop(1,'rgba(150,240,255,0.75)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-r*.7,0); ctx.lineTo(0,-r*3.4); ctx.lineTo(r*.7,0); ctx.closePath(); ctx.fill();
    ctx.shadowColor='#aef7ff'; ctx.shadowBlur=16; ctx.fillStyle='#eaffff';
    ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.shadowBlur=0;
  }
  function drawUfo(rk){
    const r=rk.r;
    ctx.fillStyle='#bfe9ff'; ctx.shadowColor='#00e5ff'; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(0,-r*.12,r*.55,Math.PI,0); ctx.fill();
    ctx.fillStyle=rk.hp>3?'#8a4dff':'#5a5f7a';
    ctx.beginPath(); ctx.ellipse(0,r*.05,r*1.35,r*.5,0,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='#ffd23f';
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.arc(i*r*0.46,r*.14,r*.09,0,7); ctx.fill(); }
  }

  // ------- Desenho dos cenarios de fundo -------
  function drawNebulaBg(){
    for(const cl of sceneData.neb){ const g=ctx.createRadialGradient(cl.x,cl.y,0,cl.x,cl.y,cl.r);
      g.addColorStop(0,cl.c); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cl.x,cl.y,cl.r,0,7); ctx.fill(); }
  }
  function drawPlanetFloor(cols,atmo,type){
    const cx=W/2, cy=H+W*0.82, R=W*1.05, capY=cy-R;
    if(atmo){ const a=ctx.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.09);
      a.addColorStop(0,'rgba('+atmo+',0)'); a.addColorStop(.7,'rgba('+atmo+',0.22)'); a.addColorStop(1,'rgba('+atmo+',0)');
      ctx.fillStyle=a; ctx.beginPath(); ctx.arc(cx,cy,R*1.09,0,7); ctx.fill(); }
    const g=ctx.createRadialGradient(cx-R*.3,cy-R*.35,R*.15,cx,cy,R);
    g.addColorStop(0,cols[0]); g.addColorStop(.6,cols[1]); g.addColorStop(1,cols[2]);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
    if(type==='earth'){ ctx.fillStyle='rgba(60,190,120,0.55)';
      for(const b of [[-.2,.04,.1],[.05,.10,.13],[.24,.03,.08],[-.34,.12,.07]]){
        ctx.beginPath(); ctx.ellipse(cx+b[0]*W, capY+b[1]*W, b[2]*W, b[2]*W*0.7, 0,0,7); ctx.fill(); } }
    if(type==='moon'){ ctx.fillStyle='rgba(0,0,0,0.16)';

  function drawGasGiant(cols){
    const cx=W*0.72, cy=H*0.22, R=Math.min(W,H)*0.16;
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.clip();
    const g=ctx.createLinearGradient(0,cy-R,0,cy+R); g.addColorStop(0,cols[0]); g.addColorStop(.5,cols[1]); g.addColorStop(1,cols[2]);
    ctx.fillStyle=g; ctx.fillRect(cx-R,cy-R,R*2,R*2);
    ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=R*0.13;
    for(let i=-2;i<=2;i++){ ctx.beginPath(); ctx.moveTo(cx-R,cy+i*R*0.32); ctx.lineTo(cx+R,cy+i*R*0.32+R*0.09); ctx.stroke(); }
    ctx.restore();

    ctx.strokeStyle='rgba(240,225,180,0.55)'; ctx.lineWidth=R*0.12;

    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.fill();
    if(dark){ ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(cx,cy,R*0.24,0,7); ctx.fill();

  function onKill(){ S.kills++;

  let best=+(localStorage.getItem('esquivaneon_best')||0);

  const player={x:W/2,y:H*0.78,tx:W/2,ty:H*0.78,r:18,cd:0};

  // ------- Detecta se tem toque; senão usa mouse/teclado -------

  // ------- Áudio -------
  let actx=null;
  function beep(f,d,type='square',vol=.06){
    try{ if(!actx) actx=new(window.AudioContext||window.webkitAudioContext)();
      const o=actx.createOscillator(),g=actx.createGain(); o.type=type; o.frequency.value=f;
      g.gain.value=vol; o.connect(g); g.connect(actx.destination); const n=actx.currentTime;
      g.gain.setValueAtTime(vol,n); g.gain.exponentialRampToValueAtTime(.0001,n+d); o.start(n); o.stop(n+d);
    }catch(_){}
  }

  // ------- Música de fundo (synth loop) -------
  const music={on:(localStorage.getItem('esquivaneon_music')!=='0'),timer:null,step:0,gain:null};
  const SEQ=[0,3,5,7,10,7,5,3,0,3,7,10,12,10,7,3];
  const BASS=[0,0,-2,-2,-4,-4,-5,-5];
  function midi(n){ return 220*Math.pow(2,n/12); }
  function playNote(freq,dur,type,vol){
    if(!actx) return;
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(music.gain||actx.destination);
    const n=actx.currentTime;
    g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(vol,n+0.02);
    g.gain.exponentialRampToValueAtTime(.0001,n+dur); o.start(n); o.stop(n+dur+0.02);
  }
  function musicTick(){
    if(!actx||!music.on) return;
    const i=music.step%SEQ.length;
    playNote(midi(SEQ[i]+12),0.28,'triangle',0.05);
    if(music.step%2===0) playNote(midi(BASS[(music.step/2)%BASS.length]-12),0.5,'sawtooth',0.045);
    if(music.step%4===0) playNote(midi(SEQ[i]+24),0.14,'square',0.02);
    music.step++;
  }
  function startMusic(){
    if(!actx||music.timer) return;
    if(!music.gain){ music.gain=actx.createGain(); music.gain.gain.value=0.7; music.gain.connect(actx.destination); }
    music.step=0; musicTick(); music.timer=setInterval(musicTick,190);
  }
  function stopMusic(){ if(music.timer){clearInterval(music.timer);music.timer=null;} }
  function toggleMusic(){
    music.on=!music.on; localStorage.setItem('esquivaneon_music',music.on?'1':'0');
    el('mute').textContent=music.on?'🔊':'🔈';
    if(music.on){ if(actx&&actx.state==='suspended')actx.resume(); startMusic(); } else stopMusic();
  }

  const rand=(a,b)=>a+Math.random()*(b-a);
  function burst(x,y,color,n=14,spd=4){ for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=rand(1,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,r:rand(1.5,3.5)});} }

  function pickKind(){
    const list=enemyWeights(S.phase); let tot=0; for(const e of list) tot+=e[1];
    let r=Math.random()*tot, acc=0;
    for(const [k,w] of list){ acc+=w; if(r<=acc) return k; }
    return 'rock';
  }
  function spawnEnemy(){
    const pd=phaseDiff(), k=pickKind();
    if(k==='sat'){
      const r=rand(17,25)+pd*2;
      rocks.push({kind:'sat',x:rand(r,W-r),y:-r,r,vx:rand(-.4,.4),vy:rand(1.0,1.5)+pd*0.28,
        hp:4+Math.round(pd*1.4),rot:0,vr:rand(-.02,.02),scoreMul:2.4});
    } else if(k==='comet'){
      const r=rand(10,15);
      rocks.push({kind:'comet',x:rand(r,W-r),y:-r,r,vx:rand(-.4,.4),vy:rand(3.4,4.6)+pd*0.5,
        hp:1,rot:0,vr:0,scoreMul:1.6});
    } else if(k==='ufo'){
      const r=rand(16,22)+pd;
      rocks.push({kind:'ufo',x:rand(r,W-r),y:-r,r,vx:rand(1.2,2.2)*(Math.random()<.5?-1:1),vy:rand(1.2,1.8)+pd*0.25,
        hp:6+Math.round(pd*1.6),rot:0,vr:0,scoreMul:3,wob:rand(0,6)});
    } else {

      rocks.push({kind:'rock',x:rand(r,W-r),y:-r,r,vx:rand(-.6,.6),vy:rand(bs,bs+1.5),
        hp:Math.max(1,Math.round(r/16)),rot:Math.random()*Math.PI,vr:rand(-.04,.04),
        spin:Array.from({length:8},()=>rand(.75,1.15)),scoreMul:1});
    }
  }
  function spawnPow(){
    const roll=Math.random(); let type=roll<.18?'life':roll<.48?'shield':roll<.78?'triple':'slow';
    const r=15; pows.push({x:rand(r,W-r),y:-r,r,vy:rand(1.5,2.2),type});
  }
  function fire(){
    if(player.cd>0) return;
    const sh=SHIPS[S.tier];
    player.cd=sh.cd;
    let shots=sh.shots.slice();
    if(S.triple>0) shots=shots.concat([-0.3,0.3]); // power-up: leque extra
    for(const a of shots) bullets.push({x:player.x+Math.sin(a)*12,y:player.y-16,vx:Math.sin(a)*9.5,vy:-13,r:4.5,dmg:sh.dmg});
    beep(820+S.tier*40,.05,'square',.03);
  }
  const addScore=n=>{S.score+=Math.round(n*S.combo);};
  function bumpCombo(){S.combo=Math.min(9,S.combo+1);S.comboTimer=150;}
  function hitPlayer(){
    if(S.shield>0){S.shield=0;beep(220,.15,'sawtooth',.08);burst(player.x,player.y,'#00e5ff',20,6);S.shake=10;return;}
    S.lives--;S.combo=1;S.flashHit=1;S.shake=16;beep(120,.3,'sawtooth',.1);burst(player.x,player.y,'#ff5b5b',26,7);
    if(navigator.vibrate) navigator.vibrate(120);
    if(S.lives<=0) endGame();
  }
  const powColor=t=>t==='life'?'#4dff88':t==='shield'?'#00e5ff':t==='triple'?'#ff2bd6':'#ffd23f';

  let last=performance.now();
  function loop(now){
    const dtRaw=Math.min(2.5,(now-last)/16.667); last=now;
    const slow=S.slowmo>0?0.4:1; update(dtRaw*slow,dtRaw); render(); requestAnimationFrame(loop);
  }
  function update(dt,dtRaw){
    for(const st of stars){ st.y+=st.z*1.2*(S.running?1:.3)*dtRaw; if(st.y>H){st.y=0;st.x=Math.random()*W;} }
    for(const p of parts){p.x+=p.vx*dtRaw;p.y+=p.vy*dtRaw;p.vx*=.96;p.vy*=.96;p.life-=.03*dtRaw;}
    parts=parts.filter(p=>p.life>0);
    if(S.shake>0) S.shake=Math.max(0,S.shake-dtRaw);
    if(S.flashHit>0) S.flashHit=Math.max(0,S.flashHit-.05*dtRaw);
    if(S.toast&&S.toast.timer>0) S.toast.timer-=dtRaw;
    if(S.banner&&S.banner.timer>0) S.banner.timer-=dtRaw;
    if(!S.running) return;
    S.t+=dt; S.difficulty=S.t/1400; S.level=1+Math.floor(S.t/600);
    if(S.slowmo>0)S.slowmo-=dtRaw; if(S.shield>0)S.shield-=dtRaw; if(S.triple>0)S.triple-=dtRaw;
    if(S.comboTimer>0){S.comboTimer-=dtRaw; if(S.comboTimer<=0)S.combo=1;}

    player.x+=(player.tx-player.x)*0.3*dt; player.y+=(player.ty-player.y)*0.3*dt;
    const kspd=6*dt;
    if(keys['ArrowLeft']||keys['KeyA']){player.tx-=kspd;player.x-=kspd;}
    if(keys['ArrowRight']||keys['KeyD']){player.tx+=kspd;player.x+=kspd;}
    if(keys['ArrowUp']||keys['KeyW']){player.ty-=kspd;player.y-=kspd;}
    if(keys['ArrowDown']||keys['KeyS']){player.ty+=kspd;player.y+=kspd;}
    player.x=Math.max(player.r,Math.min(W-player.r,player.x));
    player.y=Math.max(player.r,Math.min(H-player.r,player.y));
    player.tx=Math.max(player.r,Math.min(W-player.r,player.tx));
    player.ty=Math.max(player.r,Math.min(H-player.r,player.ty));

    if(player.cd>0) player.cd-=dt;
    // no toque atira sozinho; no PC só quando clica/espaço
    if(hasTouch ? touchId!==null : firing) fire();
    // fallback: se estiver no celular sem dedo na tela, ainda atira devagar pra não ficar parado
    if(hasTouch && touchId===null) fire();

    S.spawnTimer-=dt;
    const pd=phaseDiff();
    const interval=Math.max(13,55-pd*8);
    if(S.spawnTimer<=0){spawnEnemy();S.spawnTimer=interval; if(Math.random()<.25&&pd>.5)spawnEnemy();}
    if(Math.random()<.004*dt) spawnPow();

    for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
    bullets=bullets.filter(b=>b.y>-20);
    for(const rk of rocks){rk.x+=rk.vx*dt;rk.y+=rk.vy*dt;rk.rot+=rk.vr*dt; if(rk.x<rk.r||rk.x>W-rk.r)rk.vx*=-1;}

    for(const b of bullets){ for(const rk of rocks){ if(rk.dead)continue;
      const dx=b.x-rk.x,dy=b.y-rk.y; if(dx*dx+dy*dy<(rk.r+b.r)*(rk.r+b.r)){
        b.dead=true; rk.hp-=(b.dmg||1); burst(b.x,b.y,'#7cf7ff',5,3);
        if(rk.hp<=0){rk.dead=true;addScore(Math.round(rk.r*(rk.scoreMul||1)));bumpCombo();onKill();burst(rk.x,rk.y,SHIPS[S.tier].glow,18,5);beep(rand(300,500),.08,'triangle',.05);}
        else beep(600,.03,'square',.03); break;
      } } }
    bullets=bullets.filter(b=>!b.dead);

    for(const rk of rocks){ if(rk.dead)continue;
      const dx=player.x-rk.x,dy=player.y-rk.y,rr=player.r+rk.r-4;
      if(dx*dx+dy*dy<rr*rr){rk.dead=true;burst(rk.x,rk.y,'#ff5b5b',16,5);hitPlayer();} }
    rocks=rocks.filter(rk=>!rk.dead&&rk.y<H+rk.r+10);

    for(const pw of pows) pw.y+=pw.vy*dt;
    for(const pw of pows){ const dx=player.x-pw.x,dy=player.y-pw.y,rr=player.r+pw.r;
      if(dx*dx+dy*dy<rr*rr){ pw.dead=true;
        if(pw.type==='life')S.lives=Math.min(5,S.lives+1);
        else if(pw.type==='shield')S.shield=360; else if(pw.type==='triple')S.triple=420; else if(pw.type==='slow')S.slowmo=240;
        burst(pw.x,pw.y,powColor(pw.type),18,5); beep(700,.12,'sine',.07); addScore(20);
        if(navigator.vibrate) navigator.vibrate(30);
      } }
    pows=pows.filter(pw=>!pw.dead&&pw.y<H+20);

    S.score+=Math.round(0.4*dt);
    updateHUD();
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    const ph=PHASES[S.phase]||PHASES[0];
    const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,ph.sky[0]); g.addColorStop(1,ph.sky[1]);
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    if(ph.scene==='nebula') drawNebulaBg();
    let sx=0,sy=0; if(S.shake>0){sx=rand(-S.shake,S.shake);sy=rand(-S.shake,S.shake);}
    ctx.save(); ctx.translate(sx,sy);
    for(const st of stars){ctx.globalAlpha=st.z;ctx.fillStyle='#9fd8ff';ctx.fillRect(st.x,st.y,st.s,st.s*2.4);} ctx.globalAlpha=1;
    drawSceneFg(ph);
    for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill();} ctx.globalAlpha=1;
    for(const pw of pows){ const c=powColor(pw.type); ctx.save();ctx.translate(pw.x,pw.y);
      ctx.shadowColor=c;ctx.shadowBlur=16;ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,pw.r,0,7);ctx.fill();
      ctx.shadowBlur=0;ctx.fillStyle='#04121a';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(pw.type==='life'?'+':pw.type==='shield'?'◈':pw.type==='triple'?'⋔':'⏱',0,1); ctx.restore(); }
    for(const rk of rocks){ ctx.save();ctx.translate(rk.x,rk.y);
      if(rk.kind==='sat') drawSat(rk);
      else if(rk.kind==='comet') drawComet(rk);
      else if(rk.kind==='ufo') drawUfo(rk);
      else { ctx.rotate(rk.rot); ctx.beginPath();
        for(let i=0;i<8;i++){const a=i/8*Math.PI*2,rr=rk.r*rk.spin[i],px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
        ctx.closePath();ctx.fillStyle='#241a3d';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=rk.hp>1?'#ff2bd6':'#6b7bff';ctx.stroke(); }
      ctx.restore(); }
    ctx.fillStyle='#aef7ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;
    for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();} ctx.shadowBlur=0;

    if(S.slowmo>0){ctx.fillStyle='rgba(255,210,63,0.06)';ctx.fillRect(0,0,W,H);}
    if(S.toast&&S.toast.timer>0){
      ctx.save();

      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#fff'; ctx.shadowColor=SHIPS[S.tier].glow; ctx.shadowBlur=22;
      ctx.font='800 clamp(20px,5.5vw,34px) system-ui';

    }

      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=p.sky? '#000':'#000'; ctx.shadowBlur=18;
      ctx.fillStyle='#fff'; ctx.font='700 clamp(14px,3.6vw,22px) system-ui'; ctx.letterSpacing='3px';
      ctx.fillText(S.banner.l1, W/2, H*0.44);

      ctx.shadowColor='#00e5ff'; ctx.shadowBlur=26;

  function drawPlayer(){
    const sh=SHIPS[S.tier];

    if(S.running){ctx.beginPath();ctx.moveTo(-4,player.r*.7);ctx.lineTo(0,player.r*(1.0+S.tier*.06)+rand(2,10));ctx.lineTo(4,player.r*.7);ctx.closePath();ctx.fillStyle=S.triple>0?'#ff9de8':'#ffd23f';ctx.fill();}

  const el=id=>document.getElementById(id);

    const sh=SHIPS[S.tier], nx=SHIPS[S.tier+1];

      const base=sh.kills, need=nx.kills-base, prog=Math.min(need,S.kills-base);

      el('shipfill').style.width='100%';

  }
  function startGame(){
    S.running=true;S.over=false;S.t=0;S.score=0;S.level=1;S.lives=3;S.combo=1;S.comboTimer=0;
    S.slowmo=0;S.shield=0;S.triple=0;S.spawnTimer=0;S.difficulty=0;S.shake=0;S.flashHit=0;
    S.kills=0;S.tier=0;S.toast=null;S.phase=0;S.banner=null;initScene();
    rocks=[];bullets=[];pows=[];parts=[];
    player.x=player.tx=W/2;player.y=player.ty=H*0.78;player.cd=0;
    el('start').classList.add('hidden');el('over').classList.add('hidden');updateHUD();
    if(actx&&actx.state==='suspended')actx.resume();
    if(music.on) startMusic();
  }
  function endGame(){
    S.running=false;S.over=true;firing=false;touchId=null;
    burst(player.x,player.y,'#ff5b5b',40,9);S.shake=20;
    const rec=S.score>best; if(rec){best=S.score;localStorage.setItem('esquivaneon_best',best);}
    el('finalScore').innerHTML='Você fez <b>'+S.score+'</b> pontos';
    el('best').textContent='Recorde: '+best; el('newRecord').style.display=rec?'block':'none';
    setTimeout(()=>el('over').classList.remove('hidden'),600);
  }
  el('playBtn').addEventListener('click',()=>{if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}startGame();});
  el('againBtn').addEventListener('click',startGame);
  el('mute').textContent=music.on?'🔊':'🔈';
  el('mute').addEventListener('click',e=>{e.preventDefault();if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(_){}}toggleMusic();});
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
